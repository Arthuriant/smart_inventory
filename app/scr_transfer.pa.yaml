Screens:
  scr_transfer:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conTfrRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpTfrSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
                  activemenu: ="Transfer"
            - conTfrMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpTfrTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: ="Transfer"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: ="Stock moved between areas - transfer transactions"
                        Width: =912
                  - conTfrBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conTfrReceipt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(180, 222, 196, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(232, 246, 238, 1)
                              FillPortions: =0
                              Height: =80
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =10
                              PaddingLeft: =16
                              PaddingRight: =12
                              PaddingTop: =10
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =gblReceipt.Screen = "Transaction"
                            Children:
                              - icoTfrRcIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Success"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="CheckmarkCircle"
                                    IconColor: =RGBA(16, 124, 65, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =24
                              - conTfrRcText:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Height: =58
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - txtTfrRcTitle:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =gblReceipt.Action & " - " & gblReceipt.Title
                                          Wrap: =false
                                    - txtTfrRcDetail:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =gblReceipt.Detail
                              - icoTfrRcClose:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Close"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =32
                                    Icon: ="Dismiss"
                                    IconColor: =RGBA(100, 112, 130, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(gblReceipt, {Screen: "", Action: "", Title: "", Detail: ""})
                                    PaddingBottom: =6
                                    PaddingLeft: =6
                                    PaddingRight: =6
                                    PaddingTop: =6
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Tooltip: ="Close"
                                    Width: =32
                        - conTfrConfirm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(240, 180, 176, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(253, 237, 236, 1)
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =12
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =locShowDeleteConfirm
                            Children:
                              - icoTfrConfirmIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Warning"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="Warning"
                                    IconColor: =RGBA(196, 43, 28, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =24
                              - txtTfrConfirmMsg:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(31, 41, 55, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Delete transaction " & locSelectedRecord.transaction_number & " and all its details? Stock will not be restored."
                                    Wrap: =false
                              - btnTfrConfirmDel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Delete"
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Delete"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =104
                                    OnSelect: |-
                                      =With(
                                          {
                                              target: locSelectedRecord,
                                              lineCount: CountRows(Filter(dis_trx_details, header_id.dis_trx_header = locSelectedRecord.dis_trx_header))
                                          },
                                          // 1. Hapus semua baris di tabel detail yang nyambung ke header ini
                                          RemoveIf(
                                              dis_trx_details,
                                              header_id.dis_trx_header = target.dis_trx_header
                                          );
                                          // 2. Setelah detail bersih, baru hapus headernya
                                          Remove(dis_trx_headers, target);
                                          If(
                                              IsEmpty(Errors(dis_trx_headers)),
                                              Set(
                                                  gblReceipt,
                                                  {
                                                      Screen: "Transaction",
                                                      Action: "Deleted",
                                                      Title: target.transaction_number,
                                                      Detail: "Type " & Text(target.type) & " | " & Text(lineCount) & " detail lines also deleted | stock not restored"
                                                  }
                                              );
                                              UpdateContext({locShowDeleteConfirm: false});
                                              // 3. Munculkan notifikasi
                                              Notify("Transaction and all item details deleted successfully.", NotificationType.Success),
                                              Notify("Failed to delete transaction. " & First(Errors(dis_trx_headers)).Message, NotificationType.Error)
                                          )
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Delete"
                                    Width: =104
                              - btnTfrConfirmCancel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Dismiss"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =96
                                    OnSelect: |-
                                      =UpdateContext({locShowDeleteConfirm: false})
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Cancel"
                                    Width: =96
                        - conTfrListCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 230, 239, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - conTfrToolbar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conTfrSearchFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtTfrSearchLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Search number"
                                                Wrap: =false
                                          - inpTfrSearch:
                                              Control: ModernTextInput
                                              Properties:
                                                AccessibleLabel: ="Search transactions"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Number or note"
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                TriggerOutput: =TriggerOutput.Delayed
                                                Type: =TextInputType.Search
                                    - btnTfrAdd:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="New Transfer"
                                          AlignInContainer: =AlignInContainer.End
                                          BasePaletteColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="Add"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =176
                                          OnSelect: |-
                                            =Set(gblTfrEdit, Blank());
                                            Clear(colTfrCart);
                                            Clear(colTfrOrig);
                                            Navigate(scr_frm_transfer, ScreenTransition.None)
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="New Transfer"
                                          Width: =176
                              - conTfrTable:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conTfrHead:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(241, 244, 250, 1)
                                          FillPortions: =0
                                          Height: =36
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - txtTfrHdIco:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: =""
                                                Width: =40
                                                Wrap: =false
                                          - txtTfrHdNo:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =2
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="NUMBER / DATE"
                                                Wrap: =false
                                          - txtTfrHdArea:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =3
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="FROM  →  TO AREA"
                                                Wrap: =false
                                          - txtTfrHdAct:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="ACTIONS"
                                                Width: =112
                                                Wrap: =false
                                    - galTfr:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Transfer list"
                                          Fill: =RGBA(226, 230, 239, 1)
                                          FillPortions: =1
                                          Items: |-
                                            =Sort(
                                                Search(
                                                    Filter(
                                                        dis_trx_headers,
                                                        type = 'type (dis_trx_headers)'.Transfer
                                                    ),
                                                    inpTfrSearch.Text,
                                                    transaction_number
                                                ),
                                                'Created On',
                                                SortOrder.Descending
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =0
                                          TemplateFill: =If(ThisItem.IsSelected, RGBA(232, 238, 252, 1), RGBA(255, 255, 255, 1))
                                          TemplatePadding: =1
                                          TemplateSize: =60
                                          Visible: |-
                                            =!IsEmpty(Sort(
                                                Search(
                                                    Filter(
                                                        dis_trx_headers,
                                                        type = 'type (dis_trx_headers)'.Transfer
                                                    ),
                                                    inpTfrSearch.Text,
                                                    transaction_number
                                                ),
                                                'Created On',
                                                SortOrder.Descending
                                            ))
                                        Children:
                                          - imgTfrRowIco:
                                              Control: Image
                                              Properties:
                                                AccessibleLabel: ="Transfer"
                                                Height: =40
                                                Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='#E3ECFB'/><g fill='none' stroke='#3860B2' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 15h17'/><path d='M24 11l4 4-4 4'/><path d='M29 25H12'/><path d='M16 21l-4 4 4 4'/></g></svg>")
                                                Width: =40
                                                X: =12
                                                Y: =(Parent.TemplateHeight - 40) / 2
                                          - txtTfrRowNo:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(31, 41, 55, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =ThisItem.transaction_number
                                                Width: =(Parent.TemplateWidth - 24 - 40 - 112 - 24) * 2 / 5
                                                Wrap: =false
                                                X: =60
                                                Y: =(Parent.TemplateHeight - 40) / 2
                                          - txtTfrRowDate:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =18
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: =Text(ThisItem.'Created On', "dd mmm yyyy, hh:mm")
                                                Width: =(Parent.TemplateWidth - 24 - 40 - 112 - 24) * 2 / 5
                                                Wrap: =false
                                                X: =60
                                                Y: =(Parent.TemplateHeight - 40) / 2 + 22
                                          - txtTfrRowArea:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(31, 41, 55, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Coalesce(ThisItem.area_form.Name, "-") & "  →  " & Coalesce(ThisItem.area_to.Name, "-")
                                                Width: =(Parent.TemplateWidth - 24 - 40 - 112 - 24) * 3 / 5
                                                Wrap: =false
                                                X: =60 + (Parent.TemplateWidth - 24 - 40 - 112 - 24) * 2 / 5 + 8
                                                Y: =(Parent.TemplateHeight - 20) / 2
                                          - btnTfrRowView:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="View items of " & ThisItem.transaction_number
                                                Appearance: =ButtonAppearance.Subtle
                                                Color: =RGBA(15, 139, 114, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                Icon: ="Eye"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =UpdateContext({locTfrDetail: ThisItem, locShowTfrDetail: true})
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Size: =13
                                                Text: ="View items of " & ThisItem.transaction_number
                                                Width: =32
                                                X: =Parent.TemplateWidth - 12 - 112
                                                Y: =(Parent.TemplateHeight - 32) / 2
                                          - btnTfrRowEdit:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Edit " & ThisItem.transaction_number
                                                Appearance: =ButtonAppearance.Subtle
                                                Color: =RGBA(56, 96, 178, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                Icon: ="Edit"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =Set(gblTfrEdit, ThisItem);
                                                  ClearCollect(
                                                      colTfrOrig,
                                                      ForAll(
                                                          Filter(dis_trx_details, header_id.dis_trx_header = ThisItem.dis_trx_header) As d,
                                                          {iid: d.item.dis_item_v2, Item: d.item, Qty: d.qty}
                                                      )
                                                  );
                                                  // the cart starts with what this transfer moved; Max = stock left in From + what this transfer took out
                                                  With(
                                                      {fid: ThisItem.area_form.dis_area, tid: ThisItem.area_to.dis_area},
                                                      ClearCollect(
                                                          colTfrCart,
                                                          ForAll(
                                                              colTfrOrig As o,
                                                              {
                                                                  Item: o.Item,
                                                                  Qty: o.Qty,
                                                                  Rack: LookUp(dis_stocks, dis_item_v2.dis_item_v2 = o.iid And dis_area.dis_area = tid).rack,
                                                                  Max: Coalesce(LookUp(dis_stocks, dis_item_v2.dis_item_v2 = o.iid And dis_area.dis_area = fid).qty, 0) + o.Qty,
                                                                  FromId: fid,
                                                                  ToId: tid
                                                              }
                                                          )
                                                      )
                                                  );
                                                  Navigate(scr_frm_transfer, ScreenTransition.None)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Size: =13
                                                Text: ="Edit " & ThisItem.transaction_number
                                                Width: =32
                                                X: =Parent.TemplateWidth - 12 - 72
                                                Y: =(Parent.TemplateHeight - 32) / 2
                                          - btnTfrRowDel:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Delete " & ThisItem.transaction_number
                                                Appearance: =ButtonAppearance.Subtle
                                                Color: =RGBA(196, 43, 28, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                Icon: ="Delete"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =UpdateContext({locSelectedRecord: ThisItem, locShowDeleteConfirm: true})
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Size: =13
                                                Text: ="Delete " & ThisItem.transaction_number
                                                Visible: =nfIsAdmin
                                                Width: =32
                                                X: =Parent.TemplateWidth - 12 - 32
                                                Y: =(Parent.TemplateHeight - 32) / 2
                                    - txtTfrEmpty:
