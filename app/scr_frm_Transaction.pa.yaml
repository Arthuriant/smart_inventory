                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - txtTrxFCardTitle:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: ="Transaction"
                                    Wrap: =false
                              - frmTrxF:
                                  Control: Form
                                  Variant: Modern
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataSource: =dis_trx_headers
                                    FillPortions: =0
                                    Height: =300
                                    Item: =galTrxL.Selected
                                    NumberOfColumns: =2
                                    OnSuccess: "=// 1. Hapus semua detail lama bawaan transaksi ini (Metode Sapu Bersih)\nRemoveIf(\n    dis_trx_details,\n    header_id.dis_trx_header = frmTrxF.LastSubmit.dis_trx_header\n);\n\n// 2. Simpan ulang semua detail dari keranjang \nForAll(\n    colTempDetails As TempRecord,\n    Patch(\n        dis_trx_details,\n        Defaults(dis_trx_details),\n        {\n            header_id: frmTrxF.LastSubmit, \n            PK: frmTrxF.LastSubmit.transaction_number & \"/\" & Text(TempRecord.Urutan, \"0000\"),\n            item: LookUp(dis_item_v2S, dis_item_v2 = TempRecord.Id),\n            qty: TempRecord.Qty\n        }\n    )\n);\n\n// ==========================================================\n// 3. UPDATE STOK MANUAL (Pengganti Power Automate)\n// ==========================================================\nWith(\n    {\n        varTrxType: Text(frmTrxF.LastSubmit.type),\n        \n        // Simpan Record utuh untuk keperluan menembak Patch\n        recAreaFrom: frmTrxF.LastSubmit.area_form,\n        recAreaTo: frmTrxF.LastSubmit.area_to,\n        \n        // Ekstrak ID-nya saja untuk mengelabui bug pencarian LookUp Dataverse\n        idAreaFrom: frmTrxF.LastSubmit.area_form.dis_area,\n        idAreaTo: frmTrxF.LastSubmit.area_to.dis_area\n    },\n    ForAll(\n        colTempDetails As TempRecord,\n        \n        // --- A. LOGIKA BARANG MASUK (Receive & Transfer) ---\n        If(\n            varTrxType = \"Receive\" Or varTrxType = \"Transfer\",\n            With(\n                {\n                    varStockTo: LookUp(\n                        dis_stocks, \n                        dis_item_v2.dis_item_v2 = TempRecord.Id And dis_area.dis_area = idAreaTo\n                    )\n                },\n                If(\n                    IsBlank(varStockTo),\n                    // Jika stok KOSONG, buat baris baru\n                    Patch(\n                        dis_stocks,\n                        Defaults(dis_stocks),\n                        {\n                            PK: \"STK-\" & Text(Now(), \"yyMMddHHmmss\") & \"-\" & Text(TempRecord.Urutan, \"00\"),\n                            dis_item_v2: LookUp(dis_item_v2S, dis_item_v2 = TempRecord.Id),\n                            dis_area: recAreaTo, \n                            qty: TempRecord.Qty\n                        }\n                    ),\n                    // Jika stok SUDAH ADA, tambahkan angkanya\n                    Patch(\n                        dis_stocks,\n                        varStockTo,\n                        {\n                            qty: varStockTo.qty + TempRecord.Qty\n                        }\n                    )\n                )\n            )\n        );\n        \n        // --- B. LOGIKA BARANG KELUAR (Consume & Transfer) ---\n        If(\n            varTrxType = \"Consume\" Or varTrxType = \"Transfer\",\n            With(\n                {\n                    varStockFrom: LookUp(\n                        dis_stocks, \n                        dis_item_v2.dis_item_v2 = TempRecord.Id And dis_area.dis_area = idAreaFrom\n                    )\n                },\n                If(\n                    !IsBlank(varStockFrom), // Hanya kurangi jika barangnya memang ada\n                    Patch(\n                        dis_stocks,\n                        varStockFrom,\n                        {\n                            qty: varStockFrom.qty - TempRecord.Qty\n                        }\n                    )\n                )\n            )\n        )\n    )\n);\n\n// Bukti simpan untuk strip receipt di scr_Transaction\nSet(\n    gblReceipt,\n    {\n        Screen: \"Transaction\",\n        Action: \"Saved\",\n        Title: frmTrxF.LastSubmit.transaction_number,\n        Detail: \"Type \" & Text(frmTrxF.LastSubmit.type) & \" | From \" & Coalesce(frmTrxF.LastSubmit.area_form.Name, \"-\") & \" | To \" & Coalesce(frmTrxF.LastSubmit.area_to.Name, \"-\") & \" | Note \" & Coalesce(frmTrxF.LastSubmit.note, \"-\") & \" | \" & Text(CountRows(colTempDetails)) & \" item(s)\"\n    }\n);\n// 4. Bersihkan Keranjang & Notifikasi\nClear(colTempDetails);\nNotify(\"Transaction saved & stock updated!\", NotificationType.Success);\nBack();"
                                    Width: =Parent.Width
