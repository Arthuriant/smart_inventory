Screens:
  scr_frm_Transaction:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conTrxFRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpTrxFSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  activemenu: ="Transaction"
                  AlignInContainer: =AlignInContainer.Stretch
                  FillPortions: =0
                  Height: =640
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
            - conTrxFMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpTrxFTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: =If(frmTrxF.Mode = FormMode.Edit, "Edit Transaksi", "Transaksi Baru")
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: ="Header transaksi dan keranjang item"
                        Width: =912
                  - conTrxFBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conTrxFFormCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =RGBA(226, 230, 239, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.Light
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =368
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - txtTrxFCardTitle:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(31, 41, 55, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: ="Header Transaksi"
                                    Wrap: =false
                              - frmTrxF:
                                  Control: Form
                                  Variant: Modern
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataSource: =dis_trx_headers
                                    FillPortions: =0
                                    Height: =300
                                    Item: =galTrxL.Selected
                                    NumberOfColumns: =2
                                    OnSuccess: |-
                                      =// 1. Hapus semua detail lama bawaan transaksi ini (Metode Sapu Bersih)
                                      RemoveIf(
                                          dis_trx_details,
                                          header_id.dis_trx_header = frmTrxF.LastSubmit.dis_trx_header
                                      );

                                      // 2. Simpan ulang semua detail dari keranjang 
                                      ForAll(
                                          colTempDetails As TempRecord,
                                          Patch(
                                              dis_trx_details,
                                              Defaults(dis_trx_details),
                                              {
                                                  header_id: frmTrxF.LastSubmit, 
                                                  PK: frmTrxF.LastSubmit.transaction_number & "/" & Text(TempRecord.Urutan, "0000"),
                                                  item: LookUp(dis_item_v2S, dis_item_v2 = TempRecord.Id),
                                                  qty: TempRecord.Qty
                                              }
                                          )
                                      );

                                      // ==========================================================
                                      // 3. UPDATE STOK MANUAL (Pengganti Power Automate)
                                      // ==========================================================
                                      With(
                                          {
                                              varTrxType: Text(frmTrxF.LastSubmit.type),
                                              
                                              // Simpan Record utuh untuk keperluan menembak Patch
                                              recAreaFrom: frmTrxF.LastSubmit.area_form,
                                              recAreaTo: frmTrxF.LastSubmit.area_to,
                                              
                                              // Ekstrak ID-nya saja untuk mengelabui bug pencarian LookUp Dataverse
                                              idAreaFrom: frmTrxF.LastSubmit.area_form.dis_area,
                                              idAreaTo: frmTrxF.LastSubmit.area_to.dis_area
                                          },
                                          ForAll(
                                              colTempDetails As TempRecord,
                                              
                                              // --- A. LOGIKA BARANG MASUK (Receive & Transfer) ---
                                              If(
                                                  varTrxType = "Receive" Or varTrxType = "Transfer",
                                                  With(
                                                      {
                                                          varStockTo: LookUp(
                                                              dis_stocks, 
                                                              dis_item_v2.dis_item_v2 = TempRecord.Id And dis_area.dis_area = idAreaTo
                                                          )
                                                      },
                                                      If(
                                                          IsBlank(varStockTo),
                                                          // Jika stok KOSONG, buat baris baru
                                                          Patch(
                                                              dis_stocks,
                                                              Defaults(dis_stocks),
                                                              {
                                                                  PK: "STK-" & Text(Now(), "yyMMddHHmmss") & "-" & Text(TempRecord.Urutan, "00"),
                                                                  dis_item_v2: LookUp(dis_item_v2S, dis_item_v2 = TempRecord.Id),
                                                                  dis_area: recAreaTo, 
                                                                  qty: TempRecord.Qty
                                                              }
                                                          ),
                                                          // Jika stok SUDAH ADA, tambahkan angkanya
                                                          Patch(
                                                              dis_stocks,
                                                              varStockTo,
                                                              {
                                                                  qty: varStockTo.qty + TempRecord.Qty
                                                              }
                                                          )
                                                      )
                                                  )
                                              );
                                              
                                              // --- B. LOGIKA BARANG KELUAR (Consume & Transfer) ---
                                              If(
                                                  varTrxType = "Consume" Or varTrxType = "Transfer",
                                                  With(
                                                      {
                                                          varStockFrom: LookUp(
                                                              dis_stocks, 
                                                              dis_item_v2.dis_item_v2 = TempRecord.Id And dis_area.dis_area = idAreaFrom
                                                          )
                                                      },
                                                      If(
                                                          !IsBlank(varStockFrom), // Hanya kurangi jika barangnya memang ada
                                                          Patch(
                                                              dis_stocks,
                                                              varStockFrom,
                                                              {
                                                                  qty: varStockFrom.qty - TempRecord.Qty
                                                              }
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      );

                                      // Bukti simpan untuk strip receipt di scr_Transaction
                                      Set(
                                          gblReceipt,
                                          {
                                              Screen: "Transaction",
                                              Action: "Disimpan",
                                              Title: frmTrxF.LastSubmit.transaction_number,
                                              Detail: "Tipe " & Text(frmTrxF.LastSubmit.type) & " | Dari " & Coalesce(frmTrxF.LastSubmit.area_form.Name, "-") & " | Ke " & Coalesce(frmTrxF.LastSubmit.area_to.Name, "-") & " | Catatan " & Coalesce(frmTrxF.LastSubmit.note, "-") & " | " & Text(CountRows(colTempDetails)) & " item"
                                          }
                                      );
                                      // 4. Bersihkan Keranjang & Notifikasi
                                      Clear(colTempDetails);
                                      Notify("Transaksi berhasil disimpan & Stok terupdate!", NotificationType.Success);
                                      Back();
                                    Width: =Parent.Width
                                  Children:
                                    - transaction_number_DataCard1_TrxF:
                                        Control: TypedDataCard
                                        Variant: ModernTextualEdit
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DataField: ="cr8a3_transaction_number"
