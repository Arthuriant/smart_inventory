                        - btnTfrFCSubmit:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Save the transfer"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =RGBA(0, 18, 107, 1)
                              DisplayMode: =If(IsEmpty(colTfrCart) Or IsBlank(ddTfrFFrom.Selected) Or IsBlank(ddTfrFTo.Selected), DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Segoe UI'
                              Height: =36
                              Icon: ="ArrowSwap"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =120
                              OnSelect: |-
                                =If(
                                    IsBlank(ddTfrFFrom.Selected) Or IsBlank(ddTfrFTo.Selected),
                                    Notify("Pick both the From and the To area.", NotificationType.Error),
                                    ddTfrFFrom.Selected.dis_area = ddTfrFTo.Selected.dis_area,
                                    Notify("From and To must be different areas.", NotificationType.Error),
                                    IsEmpty(colTfrCart),
                                    Notify("The cart is empty.", NotificationType.Error),
                                    !IsEmpty(Filter(colTfrCart, Qty < 1 Or Qty > Max)),
                                    Notify("Every qty must be at least 1 and not more than what the From area has.", NotificationType.Error),
                                    With(
                                        {
                                            frA: ddTfrFFrom.Selected,
                                            toA: ddTfrFTo.Selected,
                                            fid: ddTfrFFrom.Selected.dis_area,
                                            tid: ddTfrFTo.Selected.dis_area,
                                            nt: Trim(inpTfrFNote.Text),
                                            isNew: IsBlank(gblTfrEdit),
                                            varLastTrx: First(Sort(dis_trx_headers, 'Created On', SortOrder.Descending)).transaction_number
                                        },
                                        With(
                                            {
                                                trxNo: If(
                                                    isNew,
                                                    Text(Now(), "dd/mm/yy/") & Text(If(IsBlank(varLastTrx), 1, Value(Right(varLastTrx, 4)) + 1), "0000"),
                                                    gblTfrEdit.transaction_number
                                                )
                                            },
                                            With(
                                                {
                                                    hdr: If(
                                                        isNew,
                                                        Patch(
                                                            dis_trx_headers,
                                                            Defaults(dis_trx_headers),
                                                            {transaction_number: trxNo, type: 'type (dis_trx_headers)'.Transfer, area_form: frA, area_to: toA, note: nt}
                                                        ),
                                                        Patch(dis_trx_headers, gblTfrEdit, {area_form: frA, area_to: toA, note: nt})
                                                    )
                                                },
                                                // stock movement as +/- per (item, area): an edit first undoes what the old transfer moved
                                                Clear(colTfrDelta);
                                                If(
                                                    !isNew,
                                                    ForAll(
                                                        colTfrOrig As o,
                                                        Collect(colTfrDelta, {iid: o.iid, aid: gblTfrEdit.area_form.dis_area, Item: o.Item, Area: gblTfrEdit.area_form, d: o.Qty});
                                                        Collect(colTfrDelta, {iid: o.iid, aid: gblTfrEdit.area_to.dis_area, Item: o.Item, Area: gblTfrEdit.area_to, d: -o.Qty})
                                                    );
                                                    RemoveIf(dis_trx_details, header_id.dis_trx_header = gblTfrEdit.dis_trx_header)
                                                );
                                                ForAll(
                                                    colTfrCart As c,
                                                    Collect(colTfrDelta, {iid: c.Item.dis_item_v2, aid: fid, Item: c.Item, Area: frA, d: -c.Qty});
                                                    Collect(colTfrDelta, {iid: c.Item.dis_item_v2, aid: tid, Item: c.Item, Area: toA, d: c.Qty})
                                                );
                                                ForAll(
                                                    GroupBy(colTfrDelta, iid, aid, Rows) As g,
                                                    With(
                                                        {
                                                            gi: g.iid,
                                                            ga: g.aid,
                                                            tot: Sum(g.Rows, d),
                                                            it: First(g.Rows).Item,
                                                            ar: First(g.Rows).Area,
                                                            rk: If(g.aid = tid, LookUp(colTfrCart, Item.dis_item_v2 = g.iid).Rack)
                                                        },
                                                        With(
                                                            {st: LookUp(dis_stocks, dis_item_v2.dis_item_v2 = gi And dis_area.dis_area = ga)},
                                                            If(
                                                                tot = 0 And IsBlank(rk),
                                                                false,
                                                                IsBlank(st),
                                                                Patch(
                                                                    dis_stocks,
                                                                    Defaults(dis_stocks),
                                                                    {
                                                                        PK: "STK-" & Text(Now(), "yyMMddHHmmss") & "-" & Text(RandBetween(100, 999)),
                                                                        dis_item_v2: it,
                                                                        dis_area: ar,
                                                                        qty: tot,
                                                                        rack: rk
                                                                    }
                                                                ),
                                                                Patch(dis_stocks, st, {qty: st.qty + tot, rack: If(IsBlank(rk), st.rack, rk)})
                                                            )
                                                        )
                                                    )
                                                );
                                                ForAll(
                                                    Sequence(CountRows(colTfrCart)) As n,
                                                    With(
                                                        {c: Index(colTfrCart, n.Value)},
                                                        Patch(
                                                            dis_trx_details,
                                                            Defaults(dis_trx_details),
                                                            {header_id: hdr, PK: trxNo & "/" & Text(n.Value, "0000"), item: c.Item, qty: c.Qty}
                                                        )
                                                    )
                                                );
                                                Set(
                                                    gblReceipt,
                                                    {
                                                        Screen: "Transaction",
                                                        Action: If(isNew, "Transferred", "Updated"),
                                                        Title: trxNo,
                                                        Detail: "Type Transfer | " & frA.Name & " → " & toA.Name & " | " & Text(CountRows(colTfrCart)) & " item(s), qty " & Text(Sum(colTfrCart, Qty))
                                                    }
                                                );
                                                Notify("Transfer " & trxNo & If(isNew, " saved", " updated") & " & stock moved!", NotificationType.Success);
                                                Clear(colTfrCart);
                                                Clear(colTfrOrig);
                                                Clear(colTfrDelta);
                                                UpdateContext({locTfrCartOpen: false});
                                                Navigate(scr_transfer, ScreenTransition.None)
                                            )
                                        )
                                    )
                                )
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: =If(IsBlank(gblTfrEdit), "Transfer", "Save changes")
                              Width: =150
