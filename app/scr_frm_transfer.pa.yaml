Screens:
  scr_frm_transfer:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({locTfrCartOpen: false});
        Reset(ddTfrFFrom);
        Reset(ddTfrFTo);
        Reset(inpTfrFNote);
        Reset(inpTfrFSearch);
        Reset(ddTfrFCat)
    Children:
      - conTfrFRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpTfrFSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
                  activemenu: ="Transfer"
            - conTfrFMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpTfrFTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: =If(IsBlank(gblTfrEdit), "New Transfer", "Edit Transfer " & gblTfrEdit.transaction_number)
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: =If(IsBlank(gblTfrEdit), "Move stock from one area to another", "Change the areas, note, items or qty of this transfer")
                        Width: =912
                  - conTfrFBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conTfrFListCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 230, 239, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - conTfrFAreas:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conTfrFFromFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =220
                                        Children:
                                          - txtTfrFFromLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="From area *"
                                                Wrap: =false
                                          - ddTfrFFrom:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="From area"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: =If(IsBlank(gblTfrEdit), Blank(), LookUp(nfMyAreas, dis_area = gblTfrEdit.area_form.dis_area))
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Name
                                                Items: =Sort(nfMyAreas, Name)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: |-
                                                  =// the table shows the stock of the From area: cart lines from another area are dropped
                                                  If(
                                                      !IsEmpty(Filter(colTfrCart, FromId <> Self.Selected.dis_area)),
                                                      RemoveIf(colTfrCart, FromId <> Self.Selected.dis_area);
                                                      Notify("From area changed: items of the previous area were removed from the cart.", NotificationType.Information)
                                                  )
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - txtTfrFArrow:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =18
                                          Text: ="→"
                                          Width: =20
                                          Wrap: =false
                                    - conTfrFToFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =220
                                        Children:
                                          - txtTfrFToLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="To area *"
                                                Wrap: =false
                                          - ddTfrFTo:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="To area"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: =If(IsBlank(gblTfrEdit), Blank(), LookUp(nfMyAreas, dis_area = gblTfrEdit.area_to.dis_area))
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Name
                                                Items: =Sort(nfMyAreas, Name)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: |-
                                                  =// racks belong to the To area: a new To area clears the racks picked for another area
                                                  If(
                                                      !IsEmpty(Filter(colTfrCart, ToId <> Self.Selected.dis_area)),
                                                      UpdateIf(colTfrCart, ToId <> Self.Selected.dis_area, {Rack: Blank(), ToId: Self.Selected.dis_area});
                                                      Notify("To area changed: racks in the cart were cleared.", NotificationType.Information)
                                                  )
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conTfrFNoteFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =1
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtTfrFNoteLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Note"
                                                Wrap: =false
                                          - inpTfrFNote:
                                              Control: ModernTextInput
                                              Properties:
                                                AccessibleLabel: ="Note"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: =If(IsBlank(gblTfrEdit), "", gblTfrEdit.note)
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Optional"
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                              - conTfrFToolbar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conTfrFCatFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =180
                                        Children:
                                          - txtTfrFCatLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Category"
                                                Wrap: =false
                                          - ddTfrFCat:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Filter category"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.code
                                                Items: =dis_category_items
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conTfrFSearchFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =220
                                        Children:
                                          - txtTfrFSearchLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Search item"
                                                Wrap: =false
                                          - inpTfrFSearch:
                                              Control: ModernTextInput
                                              Properties:
                                                AccessibleLabel: ="Search item"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Name, BPN or SPN"
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                TriggerOutput: =TriggerOutput.Delayed
                                                Type: =TextInputType.Search
                                    - conTfrFSpacer:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =1
                                          Height: =36
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                    - btnTfrFCart:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Open cart, " & CountRows(colTfrCart) & " item(s)"
                                          AlignInContainer: =AlignInContainer.End
                                          BasePaletteColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="Cart"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =120
                                          OnSelect: |-
                                            =UpdateContext({locTfrCartOpen: true})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="Cart (" & CountRows(colTfrCart) & ")"
                                          Width: =128
                              - txtTfrFHint:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(100, 112, 130, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Only items stocked in the From area are listed. Fill Qty, optionally pick the rack at the destination, then Add. Open the cart to review and save."
                                    Wrap: =false
                              - conTfrFHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(241, 244, 250, 1)
                                    FillPortions: =0
                                    Height: =36
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - txtTfrFHName:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(100, 112, 130, 1)
                                          FillPortions: =3
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: ="ITEM"
                                          Wrap: =false
                                    - txtTfrFHBpn:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(100, 112, 130, 1)
                                          FillPortions: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: ="BPN / SPN"
                                          Wrap: =false
                                    - txtTfrFHStock:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: ="AVAILABLE IN FROM AREA"
                                          Width: =180
                                          Wrap: =false
                                    - txtTfrFHQty:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: ="QTY"
                                          Width: =96
                                          Wrap: =false
                                    - txtTfrFHRack:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: ="RACK AT DESTINATION"
                                          Width: =180
                                          Wrap: =false
                                    - txtTfrFHAdd:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: =""
                                          Width: =88
                                          Wrap: =false
                              - galTfrF:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Stock of the From area"
                                    Fill: =RGBA(226, 230, 239, 1)
                                    Items: |-
                                      =Filter(
                                          dis_stocks,
                                          dis_area.dis_area = ddTfrFFrom.Selected.dis_area,
                                          IsBlank(ddTfrFCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddTfrFCat.Selected.dis_category_item,
                                          IsBlank(inpTfrFSearch.Text) Or StartsWith(dis_item_v2.name, inpTfrFSearch.Text) Or StartsWith(dis_item_v2.part_number, inpTfrFSearch.Text) Or StartsWith(dis_item_v2.client_number, inpTfrFSearch.Text)
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    TemplateFill: =RGBA(255, 255, 255, 1)
                                    TemplatePadding: =1
                                    TemplateSize: =56
                                    Visible: =!IsBlank(ddTfrFFrom.Selected)
                                  Children:
                                    - conTfrFRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Height: =Parent.TemplateHeight
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - txtTfrFName:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(31, 41, 55, 1)
                                                FillPortions: =3
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =ThisItem.dis_item_v2.name
                                                Wrap: =false
                                          - txtTfrFBpn:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =2
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Coalesce(ThisItem.dis_item_v2.part_number, "-") & " / " & Coalesce(ThisItem.dis_item_v2.client_number, "-")
                                                Wrap: =false
                                          - txtTfrFStock:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: =Text(ThisItem.qty + If(!IsBlank(gblTfrEdit) And ddTfrFFrom.Selected.dis_area = gblTfrEdit.area_form.dis_area, Sum(Filter(colTfrOrig, iid = ThisItem.dis_item_v2.dis_item_v2), Qty), 0)) & " " & Text(ThisItem.dis_item_v2.uom) & If(IsBlank(ThisItem.rack), "", " · Rack " & ThisItem.rack.Name)
                                                Width: =180
                                                Wrap: =false
                                          - numTfrFQty:
                                              Control: ModernNumberInput
                                              Properties:
                                                AccessibleLabel: ="Qty to transfer " & ThisItem.dis_item_v2.name
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Min: =0
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                ValidationState: =If(Self.Value < 0 Or Self.Value > ThisItem.qty + If(!IsBlank(gblTfrEdit) And ddTfrFFrom.Selected.dis_area = gblTfrEdit.area_form.dis_area, Sum(Filter(colTfrOrig, iid = ThisItem.dis_item_v2.dis_item_v2), Qty), 0), ValidationState.Error, ValidationState.None)
                                                Width: =96
                                          - ddTfrFRack:
                                              Control: ModernDropdown
                                              Properties:
