                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conFindSearchFld:
