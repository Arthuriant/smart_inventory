                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =140
                                        Children:
                                          - txtFindLocLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
