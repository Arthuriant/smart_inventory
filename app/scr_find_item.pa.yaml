                                                Height: =36
                                                ItemDisplayText: =ThisItem.Name
                                                Items: =Filter(dis_areas, (location.dis_location = ddFindLoc.Selected.dis_location Or (IsBlank(location) And 'elv_location (cr8a3_elv_location)'.dis_location = ddFindLoc.Selected.dis_location)), dis_area in nfMyAreaIds)
