                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Search item"
                                                Wrap: =false
                                          - inpFindSearch:
                                              Control: ModernTextInput
                                              Properties:
                                                AccessibleLabel: ="Search item"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Name or BPN"
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                TriggerOutput: =TriggerOutput.Delayed
                                                Type: =TextInputType.Search
                                    - icoFindReset:
                                        Control: ModernIcon
                                        Properties:
                                          AccessibleLabel: ="Reset filter"
                                          AlignInContainer: =AlignInContainer.End
                                          Height: =36
                                          Icon: ="ArrowReset"
                                          IconColor: =RGBA(100, 112, 130, 1)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Reset(ddFindCat);
                                            Reset(ddFindGeo);
                                            Reset(ddFindLoc);
                                            Reset(ddFindArea);
                                            Reset(inpFindSearch)
                                          PaddingBottom: =8
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Reset filter"
                                          Width: =36
                              - conFindTable:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =420
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conFindHead:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(241, 244, 250, 1)
                                          FillPortions: =0
                                          Height: =36
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - txtFindHName:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =3
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="NAME"
                                                Wrap: =false
                                          - txtFindHBpn:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =2
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="BPN"
                                                Wrap: =false
                                          - txtFindHSpn:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =2
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="SPN"
                                                Wrap: =false
                                          - txtFindHCat:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =2
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="CATEGORY"
                                                Wrap: =false
                                          - txtFindHStock:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="STOCK"
                                                Width: =80
                                                Wrap: =false
                                          - txtFindHUom:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="UOM"
                                                Width: =56
                                                Wrap: =false
                                          - txtFindHLoc:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =3
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="LOCATION"
                                                Wrap: =false
                                          - txtFindHAct:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="ACTIONS"
                                                Width: =88
                                                Wrap: =false
                                    - galFind:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Item stock by location"
                                          Fill: =RGBA(226, 230, 239, 1)
                                          FillPortions: =0
                                          Height: =380
                                          Items: |-
                                            =Filter(
                                                dis_stocks,
                                                // 1. Filter Kategori (Langsung 1 level)
                                                IsBlank(ddFindCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddFindCat.Selected.dis_category_item,
                                                // 2. Filter Area (Hanya filter berdasarkan Area yang dipilih, abaikan Geo/Loc karena sudah tersaring di dropdown)
                                                IsBlank(ddFindArea.Selected) Or dis_area.dis_area = ddFindArea.Selected.dis_area,
                                                // 2b. RBAC: non-admin hanya melihat stok di area yang di-assign
                                                dis_area.dis_area in nfMyAreaIds,
                                                // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)
                                                IsBlank(inpFindSearch.Text) Or
                                                StartsWith(dis_item_v2.name, inpFindSearch.Text) Or
                                                StartsWith(dis_item_v2.part_number, inpFindSearch.Text)
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =0
                                          TemplateFill: =If(ThisItem.IsSelected, RGBA(232, 238, 252, 1), RGBA(255, 255, 255, 1))
                                          TemplatePadding: =1
                                          TemplateSize: =52
                                          Visible: |-
                                            =!IsEmpty(Filter(
                                                dis_stocks,
                                                // 1. Filter Kategori (Langsung 1 level)
                                                IsBlank(ddFindCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddFindCat.Selected.dis_category_item,
                                                // 2. Filter Area (Hanya filter berdasarkan Area yang dipilih, abaikan Geo/Loc karena sudah tersaring di dropdown)
                                                IsBlank(ddFindArea.Selected) Or dis_area.dis_area = ddFindArea.Selected.dis_area,
                                                // 2b. RBAC: non-admin hanya melihat stok di area yang di-assign
                                                dis_area.dis_area in nfMyAreaIds,
                                                // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)
                                                IsBlank(inpFindSearch.Text) Or
                                                StartsWith(dis_item_v2.name, inpFindSearch.Text) Or
                                                StartsWith(dis_item_v2.part_number, inpFindSearch.Text)
                                            ))
