                                                Wrap: =false
                                          - ddFindLoc:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Filter location"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                DisplayMode: =If(IsBlank(ddFindGeo.Selected), DisplayMode.Disabled, DisplayMode.Edit)
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Name
                                                Items: =Filter(dis_locations, dis_geounit.dis_geounit = ddFindGeo.Selected.dis_geounit, dis_location in nfMyLocIds)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: =Reset(ddFindArea)
