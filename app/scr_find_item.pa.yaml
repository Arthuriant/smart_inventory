                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =Coalesce(ThisItem.dis_area.location, ThisItem.dis_area.'elv_location (cr8a3_elv_location)').Name & " - " & ThisItem.dis_area.Name
                                                      Wrap: =false
                                                - btnFindDetail:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: ="Detail " & ThisItem.dis_item_v2.name
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =ButtonAppearance.Subtle
                                                      Color: =RGBA(56, 96, 178, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =32
                                                      Icon: ="Info"
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =88
                                                      OnSelect: |-
                                                        =UpdateContext({locFindDetail: ThisItem, locShowFindDetail: true})
                                                      PaddingBottom: =0
                                                      PaddingLeft: =4
                                                      PaddingRight: =4
                                                      PaddingTop: =0
                                                      RadiusBottomLeft: =6
                                                      RadiusBottomRight: =6
                                                      RadiusTopLeft: =6
                                                      RadiusTopRight: =6
