                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      FillPortions: =3
                                                      Font: =Font.'Segoe UI'
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
