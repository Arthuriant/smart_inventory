                                          Visible: |-
                                            =IsEmpty(Filter(
                                                dis_stocks,
                                                // 1. Filter Kategori (Langsung 1 level)
                                                IsBlank(ddFindCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddFindCat.Selected.dis_category_item,
                                                // 2. Filter Area (Hanya filter berdasarkan Area yang dipilih, abaikan Geo/Loc karena sudah tersaring di dropdown)
                                                IsBlank(ddFindArea.Selected) Or dis_area.dis_area = ddFindArea.Selected.dis_area,
                                                // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)
                                                IsBlank(inpFindSearch.Text) Or
                                                StartsWith(dis_item_v2.name, inpFindSearch.Text) Or
                                                StartsWith(dis_item_v2.part_number, inpFindSearch.Text)
                                            ))
