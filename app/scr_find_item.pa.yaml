                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      FillPortions: =2
                                                      Font: =Font.'Segoe UI'
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.dis_item_v2.part_number
                                                      Wrap: =false
                                                - txtFindSpn:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      FillPortions: =2
                                                      Font: =Font.'Segoe UI'
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.dis_item_v2.client_number
                                                      Wrap: =false
                                                - txtFindCat:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      FillPortions: =2
                                                      Font: =Font.'Segoe UI'
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.dis_item_v2.dis_category_item.name
                                                      Wrap: =false
                                                - bdgFindStock:
                                                    Control: Badge
                                                    Properties:
                                                      AccessibleLabel: ="Stock " & Text(ThisItem.qty) & If(ThisItem.qty < ThisItem.dis_item_v2.min_qty, ", below minimum", "")
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: ='BadgeCanvas.Appearance'.Tint
                                                      Content: =Text(ThisItem.qty)
                                                      FontSize: =12
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =24
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Shape: ='BadgeCanvas.Shape'.Rounded
