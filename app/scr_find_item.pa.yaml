                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.dis_item_v2.name
                                                      Wrap: =false
                                                - txtFindBpn:
