                                    Icon: ="Delete"
                                    Layout: =ButtonLayout.IconBefore
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =104
                                    OnSelect: |-
                                      =With(
                                          {target: locSelectedRecord},
                                          Remove(dis_item_v2S, target);
