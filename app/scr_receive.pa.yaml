Screens:
  scr_receive:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conRcvRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpRcvSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
                  activemenu: ="Receive"
            - conRcvMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpRcvTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: ="Receive"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: ="Incoming stock - receive transactions and their items"
                        Width: =912
                  - conRcvBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conRcvReceipt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(180, 222, 196, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(232, 246, 238, 1)
                              FillPortions: =0
                              Height: =80
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =10
                              PaddingLeft: =16
                              PaddingRight: =12
                              PaddingTop: =10
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =gblReceipt.Screen = "Transaction"
                            Children:
                              - icoRcvRcIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Success"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="CheckmarkCircle"
                                    IconColor: =RGBA(16, 124, 65, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =24
                              - conRcvRcText:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Height: =58
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - txtRcvRcTitle:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =gblReceipt.Action & " - " & gblReceipt.Title
                                          Wrap: =false
                                    - txtRcvRcDetail:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =gblReceipt.Detail
                              - icoRcvRcClose:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Close"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =32
                                    Icon: ="Dismiss"
                                    IconColor: =RGBA(100, 112, 130, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(gblReceipt, {Screen: "", Action: "", Title: "", Detail: ""})
                                    PaddingBottom: =6
                                    PaddingLeft: =6
                                    PaddingRight: =6
                                    PaddingTop: =6
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Tooltip: ="Close"
                                    Width: =32
                        - conRcvConfirm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(240, 180, 176, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(253, 237, 236, 1)
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =12
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =locShowDeleteConfirm
                            Children:
                              - icoRcvConfirmIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Warning"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="Warning"
                                    IconColor: =RGBA(196, 43, 28, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =24
                              - txtRcvConfirmMsg:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(31, 41, 55, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Delete transaction " & locSelectedRecord.transaction_number & " and all its details? Stock will not be restored."
                                    Wrap: =false
                              - btnRcvConfirmDel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Delete"
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Delete"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =104
                                    OnSelect: |-
                                      =With(
                                          {
                                              target: locSelectedRecord,
                                              lineCount: CountRows(Filter(dis_trx_details, header_id.dis_trx_header = locSelectedRecord.dis_trx_header))
                                          },
                                          // 1. Hapus semua baris di tabel detail yang nyambung ke header ini
                                          RemoveIf(
                                              dis_trx_details,
                                              header_id.dis_trx_header = target.dis_trx_header
                                          );
                                          // 2. Setelah detail bersih, baru hapus headernya
                                          Remove(dis_trx_headers, target);
                                          If(
                                              IsEmpty(Errors(dis_trx_headers)),
                                              Set(
                                                  gblReceipt,
                                                  {
                                                      Screen: "Transaction",
                                                      Action: "Deleted",
                                                      Title: target.transaction_number,
                                                      Detail: "Type " & Text(target.type) & " | " & Text(lineCount) & " detail lines also deleted | stock not restored"
                                                  }
                                              );
                                              UpdateContext({locShowDeleteConfirm: false});
                                              // 3. Munculkan notifikasi
                                              Notify("Transaction and all item details deleted successfully.", NotificationType.Success),
                                              Notify("Failed to delete transaction. " & First(Errors(dis_trx_headers)).Message, NotificationType.Error)
                                          )
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Delete"
                                    Width: =104
                              - btnRcvConfirmCancel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Dismiss"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =96
                                    OnSelect: |-
                                      =UpdateContext({locShowDeleteConfirm: false})
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Cancel"
                                    Width: =96
                        - conRcvListCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 230, 239, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - conRcvToolbar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conRcvSearchFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtRcvSearchLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Search number"
                                                Wrap: =false
                                          - inpRcvSearch:
                                              Control: ModernTextInput
                                              Properties:
                                                AccessibleLabel: ="Search transactions"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Number or note"
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                TriggerOutput: =TriggerOutput.Delayed
                                                Type: =TextInputType.Search
                                    - btnRcvAdd:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="New Receive"
                                          AlignInContainer: =AlignInContainer.End
                                          BasePaletteColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="Add"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =176
                                          OnSelect: |-
                                            =Clear(colRcvCart);
                                            Navigate(scr_frm_receive, ScreenTransition.None)
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="New Receive"
                                          Width: =176
                              - conRcvTable:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conRcvHead:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(241, 244, 250, 1)
                                          FillPortions: =0
                                          Height: =36
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - txtRcvHdIco:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: =""
                                                Width: =40
                                                Wrap: =false
                                          - txtRcvHdNo:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =2
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="NUMBER / DATE"
                                                Wrap: =false
                                          - txtRcvHdArea:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =3
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="RECEIVED TO AREA"
                                                Wrap: =false
                                          - txtRcvHdAct:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="ACTIONS"
                                                Width: =112
                                                Wrap: =false
                                    - galRcv:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Receive list"
                                          Fill: =RGBA(226, 230, 239, 1)
                                          FillPortions: =1
                                          Items: |-
                                            =Sort(
                                                Search(
                                                    Filter(
                                                        dis_trx_headers,
                                                        type = 'type (dis_trx_headers)'.Receive
                                                    ),
                                                    inpRcvSearch.Text,
                                                    transaction_number
                                                ),
                                                'Created On',
                                                SortOrder.Descending
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =0
                                          TemplateFill: =If(ThisItem.IsSelected, RGBA(232, 238, 252, 1), RGBA(255, 255, 255, 1))
                                          TemplatePadding: =1
                                          TemplateSize: =60
                                          Visible: |-
                                            =!IsEmpty(Sort(
                                                Search(
                                                    Filter(
                                                        dis_trx_headers,
                                                        type = 'type (dis_trx_headers)'.Receive
                                                    ),
                                                    inpRcvSearch.Text,
                                                    transaction_number
                                                ),
                                                'Created On',
                                                SortOrder.Descending
                                            ))
                                        Children:
                                          - imgRcvRowIco:
                                              Control: Image
                                              Properties:
                                                AccessibleLabel: ="Receive"
                                                Height: =40
                                                Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='#DDF3EE'/><g fill='none' stroke='#0F8B72' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 9v13'/><path d='M15 17l5 5 5-5'/><path d='M11 21v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6'/></g></svg>")
                                                Width: =40
                                                X: =12
                                                Y: =(Parent.TemplateHeight - 40) / 2
                                          - txtRcvRowNo:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(31, 41, 55, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =ThisItem.transaction_number
                                                Width: =(Parent.TemplateWidth - 24 - 40 - 112 - 24) * 2 / 5
                                                Wrap: =false
                                                X: =60
                                                Y: =(Parent.TemplateHeight - 40) / 2
                                          - txtRcvRowDate:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =18
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: =Text(ThisItem.'Created On', "dd mmm yyyy, hh:mm")
                                                Width: =(Parent.TemplateWidth - 24 - 40 - 112 - 24) * 2 / 5
                                                Wrap: =false
                                                X: =60
                                                Y: =(Parent.TemplateHeight - 40) / 2 + 22
                                          - txtRcvRowArea:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(31, 41, 55, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Coalesce(ThisItem.area_to.Name, "-")
                                                Width: =(Parent.TemplateWidth - 24 - 40 - 112 - 24) * 3 / 5
                                                Wrap: =false
                                                X: =60 + (Parent.TemplateWidth - 24 - 40 - 112 - 24) * 2 / 5 + 8
                                                Y: =(Parent.TemplateHeight - 20) / 2
                                          - btnRcvRowView:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="View items of " & ThisItem.transaction_number
                                                Appearance: =ButtonAppearance.Subtle
                                                Color: =RGBA(15, 139, 114, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                Icon: ="Eye"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =UpdateContext({locRcvDetail: ThisItem, locShowRcvDetail: true})
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Size: =13
                                                Text: ="View items of " & ThisItem.transaction_number
                                                Width: =32
                                                X: =Parent.TemplateWidth - 12 - 112
                                                Y: =(Parent.TemplateHeight - 32) / 2
                                          - btnRcvRowEdit:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Edit " & ThisItem.transaction_number
                                                Appearance: =ButtonAppearance.Subtle
                                                Color: =RGBA(56, 96, 178, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                Icon: ="Edit"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =Set(gblRcvEdit, ThisItem);
                                                  With(
                                                      {aid: ThisItem.area_to.dis_area},
                                                      ClearCollect(
                                                          colRcvEdit,
                                                          ForAll(
                                                              Filter(dis_trx_details, header_id.dis_trx_header = ThisItem.dis_trx_header) As d,
                                                              With(
                                                                  {iid: d.item.dis_item_v2},
                                                                  {
                                                                      Detail: d,
                                                                      Item: d.item,
                                                                      OldQty: d.qty,
                                                                      Qty: d.qty,
                                                                      Rack: LookUp(dis_stocks, dis_item_v2.dis_item_v2 = iid And dis_area.dis_area = aid).rack
                                                                  }
                                                              )
                                                          )
                                                      )
                                                  );
                                                  Navigate(scr_edt_receive, ScreenTransition.None)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Size: =13
                                                Text: ="Edit " & ThisItem.transaction_number
                                                Width: =32
                                                X: =Parent.TemplateWidth - 12 - 72
                                                Y: =(Parent.TemplateHeight - 32) / 2
                                          - btnRcvRowDel:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Delete " & ThisItem.transaction_number
                                                Appearance: =ButtonAppearance.Subtle
                                                Color: =RGBA(196, 43, 28, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                Icon: ="Delete"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =UpdateContext({locSelectedRecord: ThisItem, locShowDeleteConfirm: true})
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Size: =13
                                                Text: ="Delete " & ThisItem.transaction_number
                                                Visible: =nfIsAdmin
                                                Width: =32
                                                X: =Parent.TemplateWidth - 12 - 32
                                                Y: =(Parent.TemplateHeight - 32) / 2
                                    - txtRcvEmpty:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =380
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="No receive transactions yet."
                                          Visible: |-
                                            =IsEmpty(Sort(
