Screens:
  scr_frm_category:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - con_catFrm_main:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingRight: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_catFrm_sidebar:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =180
                Children:
                  - com_catFrm_sidebar:
                      Control: CanvasComponent
                      ComponentName: Sidebar
                      Properties:
                        Width: =Parent.Width
                        activemenu: ="Category Item"
            - con_catFrm_content:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(247, 247, 248, 1)
                  FillPortions: =0
                  Height: =250
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =955
                Children:
                  - com_catFrm_topbar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: ="Category Item"
                        Height: =80
                        Width: =App.Width - 150
                  - con_catFrm_body:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(247, 247, 248, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_catFrm_formWrap:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =320
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - frm_catFrm_category:
                                  Control: Form
                                  Variant: Modern
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataSource: =dis_category_items
                                    Height: =308
                                    Item: =gal_cat_list.Selected
                                    NumberOfColumns: =2
                                    OnSuccess: |-
                                      =Notify("Kategori berhasil disimpan!", NotificationType.Success);
                                      Back();
                                    Width: =Parent.Width
                                  Children:
                                    - dc_catFrm_name:
                                        Control: TypedDataCard
                                        Variant: ModernTextualEdit
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DataField: ="cr8a3_name"
                                          Default: =ThisItem.name
                                          DisplayName: =DataSourceInfo([@dis_category_items],DataSourceInfo.DisplayName,'cr8a3_name')
                                          MaxLength: =DataSourceInfo([@dis_category_items], DataSourceInfo.MaxLength, 'cr8a3_name')
                                          Required: =true
                                          Update: =inp_catFrm_name.Text
                                          Width: =449
                                          X: =0
                                          Y: =0
                                        Children:
                                          - txt_catFrm_nameLabel:
                                              Control: ModernText
                                              MetadataKey: FieldName
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: ="Name"
                                                Width: =Parent.Width - 48
                                                Wrap: =false
                                                X: =24
                                                Y: =10
                                          - inp_catFrm_name:
                                              Control: ModernTextInput
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                Default: =Parent.Default
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =32
                                                MaxLength: =Parent.MaxLength
                                                Required: =Parent.Required
                                                Size: =12
                                                ValidationState: =If(IsBlank(Parent.Error), ValidationState.None, ValidationState.Error)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =txt_catFrm_nameLabel.Y + txt_catFrm_nameLabel.Height + 4
                                          - txt_catFrm_nameError:
                                              Control: ModernText
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                Height: =30
                                                Size: =14
                                                Text: =Parent.Error
                                                Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =inp_catFrm_name.Y + inp_catFrm_name.Height
                                          - txt_catFrm_nameStar:
                                              Control: ModernText
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                Color: =Color.Red
                                                Height: =txt_catFrm_nameLabel.Height
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Y: =txt_catFrm_nameLabel.Y
                                    - dc_catFrm_code:
                                        Control: TypedDataCard
                                        Variant: ModernTextualEdit
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DataField: ="cr8a3_code"
                                          Default: =ThisItem.code
                                          DisplayName: =DataSourceInfo([@dis_category_items],DataSourceInfo.DisplayName,'cr8a3_code')
                                          MaxLength: =DataSourceInfo([@dis_category_items], DataSourceInfo.MaxLength, 'cr8a3_code')
                                          Required: =true
                                          Update: =inp_catFrm_code.Text
                                          Width: =449
                                          X: =1
                                          Y: =0
                                        Children:
                                          - txt_catFrm_codeLabel:
                                              Control: ModernText
                                              MetadataKey: FieldName
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: ="Code"
                                                Width: =Parent.Width - 48
                                                Wrap: =false
                                                X: =24
                                                Y: =10
                                          - inp_catFrm_code:
                                              Control: ModernTextInput
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                Default: =Parent.Default
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =32
                                                MaxLength: =Parent.MaxLength
                                                Required: =Parent.Required
                                                Size: =12
                                                ValidationState: =If(IsBlank(Parent.Error), ValidationState.None, ValidationState.Error)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =txt_catFrm_codeLabel.Y + txt_catFrm_codeLabel.Height + 4
                                          - txt_catFrm_codeError:
                                              Control: ModernText
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                Height: =30
                                                Size: =14
                                                Text: =Parent.Error
                                                Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =inp_catFrm_code.Y + inp_catFrm_code.Height
                                          - txt_catFrm_codeStar:
                                              Control: ModernText
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                Color: =Color.Red
                                                Height: =txt_catFrm_codeLabel.Height
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Y: =txt_catFrm_codeLabel.Y
                                    - dc_catFrm_desc:
                                        Control: TypedDataCard
                                        Variant: ModernTextualMultilineEdit
                                        IsLocked: true
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DataField: ="cr8a3_description"
                                          Default: =ThisItem.description
                                          DisplayName: =DataSourceInfo([@dis_category_items],DataSourceInfo.DisplayName,'cr8a3_description')
                                          MaxLength: =DataSourceInfo([@dis_category_items], DataSourceInfo.MaxLength, 'cr8a3_description')
                                          Required: =false
                                          Update: =inp_catFrm_desc.Text
                                          Width: =898
                                          X: =0
                                          Y: =1
                                        Children:
                                          - txt_catFrm_descLabel:
                                              Control: ModernText
                                              MetadataKey: FieldName
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: =Parent.DisplayName
                                                Width: =Parent.Width - 48
                                                Wrap: =false
                                                X: =24
                                                Y: =10
                                          - inp_catFrm_desc:
                                              Control: ModernTextInput
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                Default: =Parent.Default
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =144
                                                MaxLength: =Parent.MaxLength
                                                Required: =Parent.Required
                                                Size: =12
                                                Type: =TextInputType.Multiline
                                                ValidationState: =If(IsBlank(Parent.Error), ValidationState.None, ValidationState.Error)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =txt_catFrm_descLabel.Y + txt_catFrm_descLabel.Height + 4
                                          - txt_catFrm_descError:
                                              Control: ModernText
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                Height: =30
                                                Size: =14
                                                Text: =Parent.Error
                                                Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =inp_catFrm_desc.Y + inp_catFrm_desc.Height
                                          - txt_catFrm_descStar:
                                              Control: ModernText
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                Color: =Color.Red
                                                Height: =txt_catFrm_descLabel.Height
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Y: =txt_catFrm_descLabel.Y
                        - con_catFrm_actions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =0
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btn_catFrm_submit:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =
                                    BasePaletteColor: =If(frm_catFrm_category.Mode = FormMode.Edit, RGBA(8, 222, 8, 1), RGBA(15, 108, 189, 1))
                                    Height: =35
                                    Icon: =If(frm_catFrm_category.Mode = FormMode.Edit, "Save", "Add")
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =SubmitForm(frm_catFrm_category)
                                    Size: =12
                                    Text: =If(frm_catFrm_category.Mode = FormMode.Edit, "Update", "Confirm")
                                    Width: =100
                              - btn_catFrm_back:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =
                                    BasePaletteColor: =RGBA(189, 178, 176, 1)
                                    Height: =35
                                    Icon: ="ArrowLeft"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: "=ResetForm(frm_catFrm_category);\nBack(); "
                                    Size: =12
                                    Text: ="Back"
                                    Width: =100
