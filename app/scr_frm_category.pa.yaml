Screens:
  scr_frm_category:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conCatFRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpCatFSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  activemenu: ="Category Item"
                  AlignInContainer: =AlignInContainer.Stretch
                  FillPortions: =0
                  Height: =640
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
            - conCatFMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpCatFTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: =If(frmCatF.Mode = FormMode.Edit, "Edit Kategori", "Tambah Kategori")
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: ="Lengkapi data kategori"
                        Width: =912
                  - conCatFBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conCatFFormCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =RGBA(226, 230, 239, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.Light
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =328
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - txtCatFCardTitle:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(31, 41, 55, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: =If(frmCatF.Mode = FormMode.Edit, "Edit Kategori - " & galCatL.Selected.name, "Kategori Baru")
                                    Wrap: =false
                              - frmCatF:
                                  Control: Form
                                  Variant: Modern
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    DataSource: =dis_category_items
                                    FillPortions: =0
                                    Height: =260
                                    Item: =galCatL.Selected
                                    NumberOfColumns: =2
                                    OnSuccess: |-
                                      =Set(
                                          gblReceipt,
                                          {
                                              Screen: "Category",
                                              Action: "Disimpan",
                                              Title: frmCatF.LastSubmit.name,
                                              Detail: "Kode " & frmCatF.LastSubmit.code & " | Deskripsi " & Coalesce(frmCatF.LastSubmit.description, "-")
                                          }
                                      );
                                      Notify("Kategori berhasil disimpan!", NotificationType.Success);
                                      Back();
                                    Width: =Parent.Width
                                  Children:
                                    - dc_catFrm_name_CatF:
                                        Control: TypedDataCard
                                        Variant: ModernTextualEdit
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DataField: ="cr8a3_name"
                                          Default: =ThisItem.name
                                          DisplayName: =DataSourceInfo([@dis_category_items],DataSourceInfo.DisplayName,'cr8a3_name')
                                          MaxLength: =DataSourceInfo([@dis_category_items], DataSourceInfo.MaxLength, 'cr8a3_name')
                                          Required: =true
                                          Update: =inp_catFrm_name_CatF.Text
                                          Width: =Parent.Width / 2
                                          X: =0
                                          Y: =0
                                        Children:
                                          - txt_catFrm_nameLabel_CatF:
                                              Control: ModernText
                                              MetadataKey: FieldName
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: ="Name"
                                                Width: =Parent.Width - 48
                                                Wrap: =false
                                                X: =24
                                                Y: =10
                                          - inp_catFrm_name_CatF:
                                              Control: ModernTextInput
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                Default: =Parent.Default
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =32
                                                MaxLength: =Parent.MaxLength
                                                Required: =Parent.Required
                                                Size: =12
                                                ValidationState: =If(IsBlank(Parent.Error), ValidationState.None, ValidationState.Error)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =txt_catFrm_nameLabel_CatF.Y + txt_catFrm_nameLabel_CatF.Height + 4
                                          - txt_catFrm_nameError_CatF:
                                              Control: ModernText
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                Height: =30
                                                Size: =14
                                                Text: =Parent.Error
                                                Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =inp_catFrm_name_CatF.Y + inp_catFrm_name_CatF.Height
                                          - txt_catFrm_nameStar_CatF:
                                              Control: ModernText
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                Color: =Color.Red
                                                Height: =txt_catFrm_nameLabel_CatF.Height
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Y: =txt_catFrm_nameLabel_CatF.Y
                                    - dc_catFrm_code_CatF:
                                        Control: TypedDataCard
                                        Variant: ModernTextualEdit
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DataField: ="cr8a3_code"
                                          Default: =ThisItem.code
                                          DisplayName: =DataSourceInfo([@dis_category_items],DataSourceInfo.DisplayName,'cr8a3_code')
                                          MaxLength: =DataSourceInfo([@dis_category_items], DataSourceInfo.MaxLength, 'cr8a3_code')
                                          Required: =true
                                          Update: =inp_catFrm_code_CatF.Text
                                          Width: =Parent.Width / 2
                                          X: =1
                                          Y: =0
                                        Children:
                                          - txt_catFrm_codeLabel_CatF:
                                              Control: ModernText
                                              MetadataKey: FieldName
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: ="Code"
                                                Width: =Parent.Width - 48
                                                Wrap: =false
                                                X: =24
                                                Y: =10
                                          - inp_catFrm_code_CatF:
                                              Control: ModernTextInput
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                Default: =Parent.Default
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =32
                                                MaxLength: =Parent.MaxLength
                                                Required: =Parent.Required
                                                Size: =12
                                                ValidationState: =If(IsBlank(Parent.Error), ValidationState.None, ValidationState.Error)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =txt_catFrm_codeLabel_CatF.Y + txt_catFrm_codeLabel_CatF.Height + 4
                                          - txt_catFrm_codeError_CatF:
                                              Control: ModernText
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                Height: =30
                                                Size: =14
                                                Text: =Parent.Error
                                                Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =inp_catFrm_code_CatF.Y + inp_catFrm_code_CatF.Height
                                          - txt_catFrm_codeStar_CatF:
                                              Control: ModernText
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                Color: =Color.Red
                                                Height: =txt_catFrm_codeLabel_CatF.Height
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Y: =txt_catFrm_codeLabel_CatF.Y
                                    - dc_catFrm_desc_CatF:
                                        Control: TypedDataCard
                                        Variant: ModernTextualMultilineEdit
                                        IsLocked: true
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          DataField: ="cr8a3_description"
                                          Default: =ThisItem.description
                                          DisplayName: =DataSourceInfo([@dis_category_items],DataSourceInfo.DisplayName,'cr8a3_description')
                                          MaxLength: =DataSourceInfo([@dis_category_items], DataSourceInfo.MaxLength, 'cr8a3_description')
                                          Required: =false
                                          Update: =inp_catFrm_desc_CatF.Text
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =1
                                        Children:
                                          - txt_catFrm_descLabel_CatF:
                                              Control: ModernText
                                              MetadataKey: FieldName
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: =Parent.DisplayName
                                                Width: =Parent.Width - 48
                                                Wrap: =false
                                                X: =24
                                                Y: =10
                                          - inp_catFrm_desc_CatF:
                                              Control: ModernTextInput
                                              MetadataKey: FieldValue
                                              Properties:
                                                AccessibleLabel: =Parent.DisplayName
                                                Default: =Parent.Default
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =144
                                                MaxLength: =Parent.MaxLength
                                                Required: =Parent.Required
                                                Size: =12
                                                Type: =TextInputType.Multiline
                                                ValidationState: =If(IsBlank(Parent.Error), ValidationState.None, ValidationState.Error)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =txt_catFrm_descLabel_CatF.Y + txt_catFrm_descLabel_CatF.Height + 4
                                          - txt_catFrm_descError_CatF:
                                              Control: ModernText
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                Height: =30
                                                Size: =14
                                                Text: =Parent.Error
                                                Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =Parent.Width - 48
                                                X: =24
                                                Y: =inp_catFrm_desc_CatF.Y + inp_catFrm_desc_CatF.Height
                                          - txt_catFrm_descStar_CatF:
                                              Control: ModernText
                                              MetadataKey: FieldRequired
                                              Properties:
                                                Align: =Align.Center
                                                Color: =Color.Red
                                                Height: =txt_catFrm_descLabel_CatF.Height
                                                PaddingBottom: =0
                                                PaddingTop: =0
                                                Text: ="*"
                                                Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =30
                                                Y: =txt_catFrm_descLabel_CatF.Y
                        - conCatFActions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnCatFBack:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Kembali"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =RGBA(31, 41, 55, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="ArrowLeft"
                                    Layout: =ButtonLayout.IconBefore
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =120
                                    OnSelect: |-
                                      =ResetForm(frmCatF);
                                      Back();
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Kembali"
                                    Width: =120
                              - btnCatFSave:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Simpan kategori"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =RGBA(0, 18, 107, 1)
                                    FillPortions: =0
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Save"
                                    Layout: =ButtonLayout.IconBefore
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =168
                                    OnSelect: =SubmitForm(frmCatF)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: =If(frmCatF.Mode = FormMode.Edit, "Simpan", "Tambah Kategori")
                                    Width: =168
