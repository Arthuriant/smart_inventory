Screens:
  scr_category:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conCatLRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpCatLSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
                  activemenu: ="Category Item"
            - conCatLMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpCatLTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: ="Category Item"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: ="Manage item categories"
                        Width: =912
                  - conCatLBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conCatLReceipt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(180, 222, 196, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(232, 246, 238, 1)
                              FillPortions: =0
                              Height: =80
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =10
                              PaddingLeft: =16
                              PaddingRight: =12
                              PaddingTop: =10
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =gblReceipt.Screen = "Category"
                            Children:
                              - icoCatLRcIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Success"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="CheckmarkCircle"
                                    IconColor: =RGBA(16, 124, 65, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =24
                              - conCatLRcText:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Height: =58
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - txtCatLRcTitle:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =gblReceipt.Action & " - " & gblReceipt.Title
                                          Wrap: =false
                                    - txtCatLRcDetail:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =gblReceipt.Detail
                              - icoCatLRcClose:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Close"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =32
                                    Icon: ="Dismiss"
                                    IconColor: =RGBA(100, 112, 130, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(gblReceipt, {Screen: "", Action: "", Title: "", Detail: ""})
                                    PaddingBottom: =6
                                    PaddingLeft: =6
                                    PaddingRight: =6
                                    PaddingTop: =6
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Tooltip: ="Close"
                                    Width: =32
                        - conCatLConfirm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(240, 180, 176, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(253, 237, 236, 1)
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =12
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =locShowDeleteConfirm
                            Children:
                              - icoCatLConfirmIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Warning"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="Warning"
                                    IconColor: =RGBA(196, 43, 28, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =24
                              - txtCatLConfirmMsg:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(31, 41, 55, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Delete category " & locSelectedRecord.name & " (" & locSelectedRecord.code & ")?"
                                    Wrap: =false
                              - btnCatLConfirmDel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Delete"
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Delete"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =104
                                    OnSelect: |-
                                      =With(
                                          {target: locSelectedRecord},
                                          Remove(dis_category_items, target);
                                          If(
                                              IsEmpty(Errors(dis_category_items)),
                                              Set(
                                                  gblReceipt,
                                                  {
                                                      Screen: "Category",
                                                      Action: "Deleted",
                                                      Title: target.name,
                                                      Detail: "Code " & target.code & " | Description " & Coalesce(target.description, "-")
                                                  }
                                              );
                                              UpdateContext({locShowDeleteConfirm: false});
                                              Notify("Category deleted successfully.", NotificationType.Success),
                                              Notify("Failed to delete category. " & First(Errors(dis_category_items)).Message, NotificationType.Error)
                                          )
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Delete"
                                    Width: =104
                              - btnCatLConfirmCancel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Dismiss"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =96
                                    OnSelect: |-
                                      =UpdateContext({locShowDeleteConfirm: false})
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Cancel"
                                    Width: =96
                        - conCatLListCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 230, 239, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =520
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - conCatLToolbar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conCatLSearchFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtCatLSearchLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Search category"
                                                Wrap: =false
                                          - inpCatLSearch:
                                              Control: ModernTextInput
                                              Properties:
                                                AccessibleLabel: ="Search category"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Name, code, or description"
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                TriggerOutput: =TriggerOutput.Delayed
                                                Type: =TextInputType.Search
                                    - btnCatLAdd:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Add Category"
                                          AlignInContainer: =AlignInContainer.End
                                          BasePaletteColor: =RGBA(0, 18, 107, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="Add"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =168
                                          OnSelect: |-
                                            =NewForm(frmCatF);
                                            Navigate(scr_frm_category);
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="Add Category"
                                          Width: =168
                              - conCatLTable:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =420
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conCatLHead:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(241, 244, 250, 1)
                                          FillPortions: =0
                                          Height: =36
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - txtCatLHName:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =3
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="NAME"
                                                Wrap: =false
                                          - txtCatLHCode:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="CODE"
                                                Width: =96
                                                Wrap: =false
                                          - txtCatLHDate:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="CREATED"
                                                Width: =96
                                                Wrap: =false
                                          - txtCatLHDesc:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =4
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="DESCRIPTION"
                                                Wrap: =false
                                          - txtCatLHAct:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="ACTIONS"
                                                Width: =72
                                                Wrap: =false
                                    - galCatL:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Category list"
                                          Fill: =RGBA(226, 230, 239, 1)
                                          FillPortions: =0
                                          Height: =380
                                          Items: |-
                                            =Search(
                                                dis_category_items,
                                                inpCatLSearch.Text,
                                                name,  
                                                code,
                                                description 
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =0
                                          TemplateFill: =If(ThisItem.IsSelected, RGBA(232, 238, 252, 1), RGBA(255, 255, 255, 1))
                                          TemplatePadding: =1
                                          TemplateSize: =52
                                          Visible: |-
                                            =!IsEmpty(Search(
                                                dis_category_items,
                                                inpCatLSearch.Text,
                                                name,  
                                                code,
                                                description 
                                            ))
                                        Children:
                                          - conCatLRow:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(0, 0, 0, 0)
                                                Height: =Parent.TemplateHeight
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =8
                                                PaddingLeft: =12
                                                PaddingRight: =12
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - txtCatLName:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      FillPortions: =3
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.name
                                                      Wrap: =false
                                                - txtCatLCode:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.code
                                                      Width: =96
                                                      Wrap: =false
                                                - txtCatLDate:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =Text(ThisItem.'Created On', "dd/mm/yyyy")
                                                      Width: =96
                                                      Wrap: =false
                                                - txtCatLDesc:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      FillPortions: =4
                                                      Font: =Font.'Segoe UI'
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.description
                                                      Wrap: =false
                                                - btnCatLEdit:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: ="Edit " & ThisItem.name
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =ButtonAppearance.Subtle
                                                      Color: =RGBA(56, 96, 178, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =32
                                                      Icon: ="Edit"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =32
                                                      OnSelect: |-
                                                        =EditForm(frmCatF);
                                                        Navigate(scr_frm_category)
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      RadiusBottomLeft: =6
                                                      RadiusBottomRight: =6
                                                      RadiusTopLeft: =6
                                                      RadiusTopRight: =6
                                                      Size: =13
                                                      Text: ="Edit " & ThisItem.name
                                                      Tooltip: ="Edit " & ThisItem.name
                                                      Width: =32
                                                - btnCatLDelete:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: ="Delete " & ThisItem.name
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =ButtonAppearance.Subtle
                                                      Color: =RGBA(196, 43, 28, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =32
                                                      Icon: ="Delete"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =32
                                                      OnSelect: |-
                                                        =UpdateContext({locSelectedRecord: ThisItem, locShowDeleteConfirm: true})
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      RadiusBottomLeft: =6
                                                      RadiusBottomRight: =6
                                                      RadiusTopLeft: =6
                                                      RadiusTopRight: =6
                                                      Size: =13
                                                      Text: ="Delete " & ThisItem.name
                                                      Tooltip: ="Delete " & ThisItem.name
                                                      Width: =32
                                    - txtCatLEmpty:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =380
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="No matching categories."
                                          Visible: |-
                                            =IsEmpty(Search(
                                                dis_category_items,
                                                inpCatLSearch.Text,
                                                name,  
                                                code,
                                                description 
                                            ))
                                          Wrap: =false
