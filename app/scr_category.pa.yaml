Screens:
  scr_category:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - con_cat_main:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingRight: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_cat_sidebar:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =180
                Children:
                  - com_cat_sidebar:
                      Control: CanvasComponent
                      ComponentName: Sidebar
                      Properties:
                        Width: =Parent.Width
                        activemenu: ="Category Item"
            - con_cat_content:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(247, 247, 248, 1)
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width - 180
                Children:
                  - com_cat_topbar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: ="Category"
                        Height: =80
                        Width: =App.Width - 150
                  - con_cat_body:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(247, 247, 248, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_cat_table:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =520
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - con_cat_toolbar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =60
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - inp_cat_search:
                                        Control: ModernTextInput
                                        Properties:
                                          BasePaletteColor: =RGBA(249, 83, 109, 1)
                                          BorderColor: =RGBA(247, 247, 248, 1)
                                          BorderStyle: =BorderStyle.Solid
                                          Default: =
                                          Fill: =RGBA(247, 247, 248, 1)
                                          Height: =30
                                          Placeholder: ="Find For Something"
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =14
                                          TriggerOutput: =TriggerOutput.Delayed
                                          Width: =300
                                    - con_cat_toolbarSpacer:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                    - btn_cat_add:
                                        Control: ModernButton
                                        Properties:
                                          Height: =32
                                          Icon: ="Add"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =NewForm(frm_catFrm_category);
                                            Navigate(scr_frm_category);
                                          Size: =12
                                          Text: ="Add Category"
                                          Width: =140
                              - con_cat_header:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(180, 214, 250, 1)
                                    FillPortions: =0
                                    Height: =35
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lbl_cat_hdrName:
                                        Control: Label
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(53, 61, 63, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =10
                                          Text: ="Name"
                                          Width: =160
                                    - lbl_cat_hdrDate:
                                        Control: Label
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(53, 61, 63, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =10
                                          Text: ="DATE"
                                          Width: =120
                                    - lbl_cat_hdrCode:
                                        Control: Label
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(53, 61, 63, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =10
                                          Text: ="Code"
                                          Width: =80
                                    - lbl_cat_hdrDesc:
                                        Control: Label
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(53, 61, 63, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =10
                                          Text: ="Description"
                                          Width: =240
                                    - con_cat_hdrSpacer:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =120
                                    - lbl_cat_hdrAction:
                                        Control: Label
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =RGBA(53, 61, 63, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =10
                                          Text: ="ACTION"
                                          Width: =100
                              - con_cat_galleryWrap:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =Parent.Height - con_cat_toolbar.Height - con_cat_header.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - gal_cat_list:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Height: =Parent.Height
                                          Items: |-
                                            =Search(
                                                dis_category_items,
                                                inp_cat_search.Text,
                                                name,  
                                                code,
                                                description 
                                            )
                                          TemplateSize: =50
                                          Width: =Parent.Width
                                        Children:
                                          - con_cat_row:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                Fill: |-
                                                  =If(
                                                      ThisItem.IsSelected,
                                                      RGBA(234, 243, 255, 1), 
                                                      RGBA(255, 255, 255, 1)  
                                                  )
                                                Height: =50
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                PaddingBottom: =8
                                                PaddingLeft: =8
                                                PaddingRight: =8
                                                PaddingTop: =8
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =Parent.Width
                                              Children:
                                                - txt_cat_rowName:
                                                    Control: ModernText
                                                    Properties:
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      Size: =12
                                                      Text: =ThisItem.name
                                                      Width: =150
                                                - txt_cat_rowDate:
                                                    Control: ModernText
                                                    Properties:
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      Size: =12
                                                      Text: =Text(ThisItem.'Created On', "dd/mm/yyyy")
                                                      Width: =110
                                                - txt_cat_rowCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Align: =Align.Center
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =RGBA(53, 61, 63, 1)
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =16
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      RadiusBottomLeft: =4
                                                      RadiusBottomRight: =4
                                                      RadiusTopLeft: =4
                                                      RadiusTopRight: =4
                                                      Size: =12
                                                      Text: =ThisItem.code
                                                      Width: =80
                                                - txt_cat_rowDesc:
                                                    Control: ModernText
                                                    Properties:
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      PaddingLeft: =20
                                                      Size: =12
                                                      Text: =ThisItem.description
                                                      Width: =380
                                                - btn_cat_rowEdit:
                                                    Control: ModernButton
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                      FontWeight: =FontWeight.Bold
                                                      Height: =32
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =EditForm(frm_catFrm_category);
                                                        Navigate(scr_frm_category);
                                                      Size: =12
                                                      Text: ="Update"
                                                      Width: =70
                                                - con_cat_rowSpacer:
                                                    Control: GroupContainer
                                                    Variant: ManualLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Width: =15
                                                - btn_cat_rowDelete:
                                                    Control: ModernButton
                                                    Properties:
                                                      BasePaletteColor: =RGBA(249, 83, 109, 1)
                                                      FontWeight: =FontWeight.Bold
                                                      Height: =32
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =Remove(dis_category_items, ThisItem);
                                                        Notify("Kategori berhasil dihapus.", NotificationType.Success);
                                                      Size: =12
                                                      Text: ="Delete"
                                                      Width: =70
