Screens:
  Register:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conRegRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conRegBrand:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 18, 107, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =48
                  PaddingLeft: =48
                  PaddingRight: =48
                  PaddingTop: =48
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - imgRegLogo:
                      Control: Image
                      Properties:
                        AccessibleLabel: ="SLB logo"
                        AlignInContainer: =AlignInContainer.Start
                        Height: =56
                        Image: ='slb logo white'
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =140
                  - txtRegTitle:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =92
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =30
                        Text: ="DIGITAL INVENTORY SYSTEM"
                  - txtRegTag:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 0.8)
                        Font: =Font.'Segoe UI'
                        Height: =42
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Well Construction Equipment & Fluid - ING - TLM"
            - conRegRight:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =48
                  PaddingLeft: =48
                  PaddingRight: =48
                  PaddingTop: =48
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conRegCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(226, 230, 239, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =466
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =28
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =472
                      Children:
                        - txtRegHello:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(31, 41, 55, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =24
                              Text: ="Hello, new user"
                              Wrap: =false
                        - txtRegIntro:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(100, 112, 130, 1)
                              Font: =Font.'Segoe UI'
                              Height: =54
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: ="To use the Digital Inventory App, please contact one of the following Administrators to register your account:"
                        - galRegAdmins:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Administrator list"
                              Fill: =RGBA(226, 230, 239, 1)
                              FillPortions: =0
                              Height: =300
                              Items: =Filter(dis_users, role = dis_role.administrator)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Selectable: =false
                              TabIndex: =0
                              TemplateFill: =If(ThisItem.IsSelected, RGBA(232, 238, 252, 1), RGBA(255, 255, 255, 1))
                              TemplatePadding: =1
                              TemplateSize: =72
                              Visible: =!IsEmpty(Filter(dis_users, role = dis_role.administrator))
                            Children:
                              - conRegRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    PaddingLeft: =12
                                    PaddingRight: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - txtRegInfo:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Administrator " & ThisItem.Name & ", " & ThisItem.email
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          Height: =60
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: |-
                                            =ThisItem.Name & Char(10) & ThisItem.email & Char(10) & "Area: " & Coalesce(ThisItem.Assigned_area.Name, "-")
                                    - btnRegMail:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Send email to " & ThisItem.Name
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Subtle
                                          Color: =RGBA(56, 96, 178, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =32
                                          Icon: ="Mail"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =32
                                          OnSelect: =Launch("mailto:" & ThisItem.email)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Size: =13
                                          Text: ="Send email to " & ThisItem.Name
                                          Tooltip: ="Send email to " & ThisItem.Name
                                          Width: =32
                        - txtRegEmpty:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(100, 112, 130, 1)
                              Font: =Font.'Segoe UI'
                              Height: =300
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: ="No administrators registered yet."
                              Visible: =IsEmpty(Filter(dis_users, role = dis_role.administrator))
                              Wrap: =false
