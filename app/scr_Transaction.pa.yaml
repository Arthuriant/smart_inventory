                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =200
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =If(IsBlank(galTrxL.Selected), "Pilih nomor transaksi di atas untuk melihat detail.", "Tidak ada item yang cocok.")
                                          Visible: |-
                                            =IsEmpty(Filter(
                                                dis_trx_details,
                                                header_id.dis_trx_header = galTrxL.Selected.dis_trx_header
                                                &&
                                                (
                                                    IsBlank(ddTrxLDCat.Selected) ||
                                                    item.dis_category_item.name = ddTrxLDCat.Selected.name
                                                )
                                                &&
                                                (
                                                    IsBlank(inpTrxLDSearch.Text) ||
                                                    StartsWith(item.name, inpTrxLDSearch.Text) ||
                                                    StartsWith(item.part_number, inpTrxLDSearch.Text)
                                                )
                                            ))
                                          Wrap: =false
