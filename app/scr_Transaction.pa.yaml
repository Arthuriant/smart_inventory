                                    PaddingLeft: =6
                                    PaddingRight: =6
                                    PaddingTop: =6
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
