                                    Width: =32
                        - conTrxLConfirm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(240, 180, 176, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(253, 237, 236, 1)
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =12
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =locShowDeleteConfirm
                            Children:
                              - icoTrxLConfirmIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Peringatan"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="Warning"
                                    IconColor: =RGBA(196, 43, 28, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =24
                              - txtTrxLConfirmMsg:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(31, 41, 55, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Hapus transaksi " & locSelectedRecord.transaction_number & " beserta semua detailnya? Stok tidak dikembalikan."
                                    Wrap: =false
                              - btnTrxLConfirmDel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Hapus"
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Delete"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =104
                                    OnSelect: |-
                                      =With(
                                          {
                                              target: locSelectedRecord,
                                              lineCount: CountRows(Filter(dis_trx_details, header_id.dis_trx_header = locSelectedRecord.dis_trx_header))
                                          },
                                          // 1. Hapus semua baris di tabel detail yang nyambung ke header ini
                                          RemoveIf(
                                              dis_trx_details,
                                              header_id.dis_trx_header = target.dis_trx_header
                                          );
                                          // 2. Setelah detail bersih, baru hapus headernya
                                          Remove(dis_trx_headers, target);
                                          If(
                                              IsEmpty(Errors(dis_trx_headers)),
                                              Set(
                                                  gblReceipt,
                                                  {
                                                      Screen: "Transaction",
                                                      Action: "Dihapus",
                                                      Title: target.transaction_number,
                                                      Detail: "Tipe " & Text(target.type) & " | " & Text(lineCount) & " baris detail ikut dihapus | stok tidak dikembalikan"
                                                  }
                                              );
                                              UpdateContext({locShowDeleteConfirm: false});
                                              // 3. Munculkan notifikasi
                                              Notify("Data transaksi beserta seluruh detail item berhasil dihapus.", NotificationType.Success),
                                              Notify("Gagal menghapus transaksi. " & First(Errors(dis_trx_headers)).Message, NotificationType.Error)
                                          )
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Hapus"
                                    Width: =104
                              - btnTrxLConfirmCancel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Batal"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Dismiss"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =96
                                    OnSelect: |-
