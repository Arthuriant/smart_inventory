                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - txtPicLoc:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(31, 41, 55, 1)
                                                FillPortions: =2
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Coalesce(ThisItem.location.Name, "-")
                                                Wrap: =false
                                          - txtPicBl:
