                                                Color: =RGBA(31, 41, 55, 1)
                                                FillPortions: =2
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Coalesce(ThisItem.'business line'.Name, "-")
                                                Wrap: =false
                                          - txtPicMail:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(31, 41, 55, 1)
                                                FillPortions: =4
                                                Font: =Font.'Segoe UI'
                                                Height: =20
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =Coalesce(ThisItem.email, "-")
                                                Wrap: =false
                                          - btnPicEdit:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Edit PIC " & ThisItem.Name
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =ButtonAppearance.Subtle
                                                Color: =RGBA(56, 96, 178, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                Icon: ="Edit"
                                                Layout: =ButtonLayout.IconOnly
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =32
                                                OnSelect: |-
                                                  =UpdateContext({locPicSel: ThisItem, locPicDel: Blank()});
                                                  Reset(ddPicLoc);
                                                  Reset(ddPicBl);
                                                  Reset(inpPicEmail)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Size: =13
                                                Text: ="Edit PIC " & ThisItem.Name
                                                Width: =32
                                          - btnPicDel:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Remove PIC " & ThisItem.Name
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =ButtonAppearance.Subtle
                                                Color: =RGBA(196, 43, 28, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                Icon: ="Delete"
                                                Layout: =ButtonLayout.IconOnly
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =32
                                                OnSelect: |-
                                                  =UpdateContext({locPicDel: ThisItem})
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Size: =13
                                                Text: ="Remove PIC " & ThisItem.Name
                                                Width: =32
                              - txtPicEmpty:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
