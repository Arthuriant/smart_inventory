App:
  Properties:
    BackEnabled: =false
    Formulas: |-
      =fxMenuItems = Table(
          {
              TextValue: "Dashboard",
              Icon: "Home",
              NavigateScreen: scr_consume
          },
          {
              TextValue: "Category Item",
              Icon: "AppsList", 
              NavigateScreen: scr_category
          },
          {
              TextValue: "Item",
              Icon: "Folder", 
              NavigateScreen: scr_item
          },
          {
              TextValue: "Area",
              Icon: "BuildingRetail", 
              NavigateScreen: Area
          },
          {
              TextValue: "User",
              Icon: "Person", 
              NavigateScreen: scr_user
          },
          {
              TextValue: "Consume",
              Icon: "Wrench", 
              NavigateScreen: scr_consume
          },
              {
              TextValue: "Transaction",
              Icon: "Cart", 
              NavigateScreen: scr_Transaction
          },
          {
              TextValue: "Find Item",
              Icon: "Search", 
              NavigateScreen: scr_find_item
          },
          {
              TextValue: "History",
              Icon: "History", 
              NavigateScreen: scr_History
          }
      );
    OnStart: |-
      =Set(
          imyrole,
          LookUp(
              dis_users,
              email = User().Email
          ).role
      );
      Set(
          imyid,
          LookUp(
              dis_users,
              email = User().Email
          ).dis_user
      );
      Set(
          imyarea,
          LookUp(
              dis_users,
              email = User().Email
          ).elv_assigned_area
      );
      ClearCollect(
          iroleview,
          LookUp(
              dis_users,
              email = User().Email
          ).'dis_areas (cr8a3_elv_dis_user_elv_dis_area_elv_dis_area)'
      )
    StartScreen: =If(IsBlank(LookUp(dis_users, email = User().Email).Name), Register, 'Log In')
    Theme: =PowerAppsTheme
