ComponentDefinitions:
  Sidebar:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      activemenu:
        PropertyKind: Input
        DisplayName: activemenu
        Description: TextValue of the active fxMenuItems entry
        DataType: Text
        Default: =""
    Properties:
      Height: =640
      Width: =224
    Children:
      - conSbRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 18, 107, 1)
            Height: =Sidebar.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =16
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Sidebar.Width
            X: =0
            Y: =0
          Children:
            - conSbBrand:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - imgSbLogo:
                      Control: Image
                      Properties:
                        AccessibleLabel: ="SLB logo"
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =0
                        Height: =32
                        Image: ='slb logo white'
                        ImagePosition: =ImagePosition.Fit
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =64
                  - txtSbBrand:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Digital Inventory"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Digital Inventory"
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =true
            - txtSbSection:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Menu"
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =RGBA(255, 255, 255, 0.55)
                  FillPortions: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =8
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="MENU"
                  VerticalAlign: =VerticalAlign.Bottom
                  Wrap: =false
            - galSbMenu:
                Control: Gallery
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Menu navigasi"
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  Items: =fxMenuItems
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  ShowScrollbar: =false
                  TabIndex: =0
                  TemplatePadding: =2
                  TemplateSize: =40
                Children:
                  - conSbItem:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(ThisItem.TextValue = Sidebar.activemenu, RGBA(255, 255, 255, 0.16), RGBA(0, 0, 0, 0))
                        Height: =Parent.TemplateHeight
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =12
                        PaddingRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.TemplateWidth
                      Children:
                        - icoSbItem:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: =ThisItem.TextValue
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Height: =20
                              Icon: =ThisItem.Icon
                              IconColor: =If(ThisItem.TextValue = Sidebar.activemenu, RGBA(255, 255, 255, 1), RGBA(255, 255, 255, 0.72))
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(ThisItem.NavigateScreen, ScreenTransition.None)
                              Width: =20
                        - txtSbItem:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Buka " & ThisItem.TextValue
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =If(ThisItem.TextValue = Sidebar.activemenu, RGBA(255, 255, 255, 1), RGBA(255, 255, 255, 0.72))
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.TextValue = Sidebar.activemenu, FontWeight.Semibold, FontWeight.Normal)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(ThisItem.NavigateScreen, ScreenTransition.None)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: =ThisItem.TextValue
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
            - conSbProfile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 0.08)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =10
                  PaddingRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - imgSbAvatar:
                      Control: Image
                      Properties:
                        AccessibleLabel: ="Foto profil"
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =0
                        Height: =36
                        Image: =User().Image
                        ImagePosition: =ImagePosition.Fill
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        Width: =36
                  - conSbProfileText:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtSbUserName:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Pengguna " & Coalesce(nfMe.Name, User().FullName)
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: =Coalesce(nfMe.Name, User().FullName)
                              Wrap: =false
                        - txtSbUserRole:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Peran " & If(IsBlank(imyrole), "Belum terdaftar", Proper(Text(imyrole)))
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(255, 255, 255, 0.72)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: =If(IsBlank(imyrole), "Belum terdaftar", Proper(Text(imyrole)))
                              Wrap: =false
