ComponentDefinitions:
  Sidebar:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      activemenu:
        PropertyKind: Input
        DisplayName: activemenu
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =App.Height
      Width: =200
    Children:
      - Main:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Sidebar.Width
          Children:
            - SLBLogo:
                Control: Image
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoDisableOnSelect: =false
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =80
                  Image: ='SLB_Logo_2022.svg'
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width
            - Items:
                Control: Gallery
                Variant: VariableHeight
                Properties:
                  BorderColor: =RGBA(243, 242, 241, 1)
                  FocusedBorderColor: =RGBA(98, 100, 167, 1)
                  FocusedBorderThickness: =2
                  Height: =Profile.Y - Self.Y
                  Items: =fxMenuItems
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =50
                  Width: =Sidebar.Width
                  Y: =44
                Children:
                  - c_items:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =15
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Items.Width
                      Children:
                        - icon_items:
                            Control: ModernIcon
                            Properties:
                              Height: =25
                              Icon: =ThisItem.Icon
                              IconColor: |-
                                =If(
                                    ThisItem.TextValue = Sidebar.activemenu, 
                                    Color.Blue, 
                                    Color.Gray
                                )
                              OnSelect: =Navigate(ThisItem.NavigateScreen)
                              Width: =25
                              Y: =18
                        - name_items:
                            Control: FluentV8/Label
                            Properties:
                              Color: |-
                                =If(
                                    ThisItem.TextValue = Sidebar.activemenu, 
                                    Color.Blue, 
                                    Color.Gray
                                )
                              Font: =Font.'Open Sans'
                              FontWeight: =If(App.ActiveScreen = ThisItem.NavigateScreen, FontWeight.Bold, FontWeight.Normal)
                              OnSelect: =Navigate(ThisItem.NavigateScreen, ScreenTransition.Fade)
                              Text: =ThisItem.TextValue
                              Width: =100
                              X: =32
                              Y: =18
            - Profile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: |
                    =
                  FillPortions: =0
                  Height: =30
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingLeft: =5
                  Width: =Main.Width
                  Y: =Parent.Height - Self.Height
                Children:
                  - Icon_Profile:
                      Control: Image
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Height: =30
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Image: =User().Image
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =30
                  - c_profile:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: |
                          =
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Profile.Width
                      Children:
                        - name:
                            Control: ModernText
                            Properties:
                              FontWeight: =FontWeight.Bold
                              Height: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: =User().FullName
                              Width: |
                                =150
                        - role:
                            Control: ModernText
                            Properties:
                              Height: =12
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8
                              Text: ="User"
                              Width: =80
