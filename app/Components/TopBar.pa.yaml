ComponentDefinitions:
  TopBar:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ActiveMenu:
        PropertyKind: Input
        DisplayName: ActiveMenu
        Description: Page title
        DataType: Text
        Default: =""
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Optional page subtitle
        DataType: Text
        Default: =""
    Properties:
      Height: =64
      Width: =912
    Children:
      - conTbRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =TopBar.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            PaddingBottom: =8
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =TopBar.Width
          Children:
            - conTbTitles:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  Height: =46
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - txtTbTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =TopBar.ActiveMenu
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(31, 41, 55, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =27
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: =TopBar.ActiveMenu
                        Wrap: =false
                  - txtTbSubtitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =TopBar.Subtitle
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(100, 112, 130, 1)
                        Font: =Font.'Segoe UI'
                        Height: =18
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =TopBar.Subtitle
                        Visible: =!IsBlank(TopBar.Subtitle)
                        Wrap: =false
            - txtTbDate:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Today's date"
                  Align: =Align.Right
                  AlignInContainer: =AlignInContainer.Center
                  Color: =RGBA(100, 112, 130, 1)
                  Font: =Font.'Segoe UI'
                  Height: =20
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =Text(Today(), "dddd, dd mmmm yyyy", "en-US")
                  Width: =240
                  Wrap: =false
