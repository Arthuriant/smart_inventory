                                              Action: "Saved",
                                              Title: frmItmF.LastSubmit.name,
                                              Detail: "BPN " & Coalesce(frmItmF.LastSubmit.part_number, "-") & " | SPN " & Coalesce(frmItmF.LastSubmit.client_number, "-") & " | Min " & Text(frmItmF.LastSubmit.min_qty) & " | UoM " & Text(frmItmF.LastSubmit.uom) & " | Status " & Text(frmItmF.LastSubmit.status) & " | Category " & Coalesce(frmItmF.LastSubmit.dis_category_item.name, "-") & " | Description " & Coalesce(frmItmF.LastSubmit.description, "-") & " | Image " & If(IsBlank(frmItmF.LastSubmit.Image), "none", "attached")
