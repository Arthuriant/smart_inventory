Screens:
  scr_geoloc:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({locGeoMode: "", locLocMode: "", locShowDel: false})
    Children:
      - conGlRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpGlSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
                  activemenu: ="Geounit & Location"
            - conGlMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpGlTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: ="Geounit & Location"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: ="Manage geounits and their locations"
                        Width: =912
                  - conGlBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conGlReceipt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(180, 222, 196, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(232, 246, 238, 1)
                              FillPortions: =0
                              Height: =80
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =10
                              PaddingLeft: =16
                              PaddingRight: =12
                              PaddingTop: =10
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =gblReceipt.Screen = "GeoLoc"
                            Children:
                              - icoGlRcIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Success"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="CheckmarkCircle"
                                    IconColor: =RGBA(16, 124, 65, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =24
                              - conGlRcText:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Height: =58
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - txtGlRcTitle:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =gblReceipt.Action & " - " & gblReceipt.Title
                                          Wrap: =false
                                    - txtGlRcDetail:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 112, 130, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =gblReceipt.Detail
                              - icoGlRcClose:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Close"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =32
                                    Icon: ="Dismiss"
                                    IconColor: =RGBA(100, 112, 130, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(gblReceipt, {Screen: "", Action: "", Title: "", Detail: ""})
                                    PaddingBottom: =6
                                    PaddingLeft: =6
                                    PaddingRight: =6
                                    PaddingTop: =6
                                    Tooltip: ="Close"
                                    Width: =32
                        - conGlConfirm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(240, 180, 176, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(253, 237, 236, 1)
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =12
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =locShowDel
                            Children:
                              - icoGlConfirmIco:
                                  Control: ModernIcon
                                  Properties:
                                    AccessibleLabel: ="Warning"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =24
                                    Icon: ="Warning"
                                    IconColor: =RGBA(196, 43, 28, 1)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =24
                              - txtGlConfirmMsg:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(31, 41, 55, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Delete " & Lower(locDelKind) & " " & If(locDelKind = "Geounit", locDelGeo.elv_name_short, locDelLoc.Name) & "? Deleted data cannot be recovered."
                                    Wrap: =false
                              - btnGlConfirmDel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Delete"
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Delete"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =104
                                    OnSelect: |-
                                      =If(
                                          locDelKind = "Geounit",
                                          With(
                                              {target: locDelGeo},
                                              Remove(dis_geounits, target);
                                              If(
                                                  IsEmpty(Errors(dis_geounits)),
                                                  Set(gblReceipt, {Screen: "GeoLoc", Action: "Deleted", Title: "Geounit " & target.elv_name_short, Detail: "Long name " & Coalesce(target.elv_name_long, "-")});
                                                  UpdateContext({locShowDel: false, locGeoMode: "", locLocMode: ""});
                                                  Notify("Geounit deleted successfully!", NotificationType.Success),
                                                  Notify("Failed to delete geounit. " & First(Errors(dis_geounits)).Message, NotificationType.Error)
                                              )
                                          ),
                                          With(
                                              {target: locDelLoc},
                                              Remove(dis_locations, target);
                                              If(
                                                  IsEmpty(Errors(dis_locations)),
                                                  Set(gblReceipt, {Screen: "GeoLoc", Action: "Deleted", Title: "Location " & target.Name, Detail: "Geounit " & Coalesce(target.dis_geounit.elv_name_short, "-")});
                                                  UpdateContext({locShowDel: false, locLocMode: ""});
                                                  Notify("Location deleted successfully!", NotificationType.Success),
                                                  Notify("Failed to delete location. " & First(Errors(dis_locations)).Message, NotificationType.Error)
                                              )
                                          )
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Delete"
                                    Width: =104
                              - btnGlConfirmCancel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    Icon: ="Dismiss"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =96
                                    OnSelect: |-
                                      =UpdateContext({locShowDel: false})
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    Text: ="Cancel"
                                    Width: =96
                        - conGlCols:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =600
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - conGlGeoCard:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(226, 230, 239, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                  Children:
                                    - conGlGeoToolbar:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =36
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtGlGeoTitle:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(31, 41, 55, 1)
                                                FillPortions: =1
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =16
                                                Text: ="Geounit"
                                                Wrap: =false
                                          - btnGlGeoAdd:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Add geounit"
                                                AlignInContainer: =AlignInContainer.Center
                                                BasePaletteColor: =RGBA(0, 18, 107, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                Icon: ="Add"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =140
                                                OnSelect: |-
                                                  =UpdateContext({locGeoMode: "Add", locGeoEdit: Blank()});
                                                  Reset(inpGlGeoShort);
                                                  Reset(inpGlGeoLong)
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                Text: ="Add Geounit"
                                                Width: =140
                                    - conGlGeoEdit:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(180, 214, 250, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(241, 244, 250, 1)
                                          FillPortions: =0
                                          Height: =156
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =10
                                          RadiusBottomRight: =10
                                          RadiusTopLeft: =10
                                          RadiusTopRight: =10
                                          Visible: =!IsBlank(locGeoMode)
                                        Children:
                                          - txtGlGeoEdTitle:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(31, 41, 55, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =If(locGeoMode = "Edit", "Edit geounit " & locGeoEdit.elv_name_short, "New geounit")
                                                Wrap: =false
                                          - conGlGeoEdFields:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =56
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =8
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - conGlGeoShortFld:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Width: =120
                                                    Children:
                                                      - txtGlGeoShortLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(100, 112, 130, 1)
                                                            Font: =Font.'Segoe UI'
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =16
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingRight: =0
                                                            PaddingTop: =0
                                                            Size: =11
                                                            Text: ="Short name *"
                                                            Wrap: =false
                                                      - inpGlGeoShort:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AccessibleLabel: ="Geounit short name"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: =If(locGeoMode = "Edit", locGeoEdit.elv_name_short, "")
                                                            Font: =Font.'Segoe UI'
                                                            Height: =36
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Placeholder: ="e.g. ING"
                                                            RadiusBottomLeft: =8
                                                            RadiusBottomRight: =8
                                                            RadiusTopLeft: =8
                                                            RadiusTopRight: =8
                                                            Size: =13
                                                - conGlGeoLongFld:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                    Children:
                                                      - txtGlGeoLongLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(100, 112, 130, 1)
                                                            Font: =Font.'Segoe UI'
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =16
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingRight: =0
                                                            PaddingTop: =0
                                                            Size: =11
                                                            Text: ="Long name *"
                                                            Wrap: =false
                                                      - inpGlGeoLong:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AccessibleLabel: ="Geounit long name"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: =If(locGeoMode = "Edit", locGeoEdit.elv_name_long, "")
                                                            Font: =Font.'Segoe UI'
                                                            Height: =36
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Placeholder: ="e.g. Indonesia"
                                                            RadiusBottomLeft: =8
                                                            RadiusBottomRight: =8
                                                            RadiusTopLeft: =8
                                                            RadiusTopRight: =8
                                                            Size: =13
                                          - conGlGeoEdBtns:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =36
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =8
                                                LayoutJustifyContent: =LayoutJustifyContent.End
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - btnGlGeoCancel:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: ="Cancel"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =ButtonAppearance.Secondary
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =36
                                                      Icon: ="Dismiss"
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =96
                                                      OnSelect: |-
                                                        =UpdateContext({locGeoMode: ""})
                                                      RadiusBottomLeft: =8
                                                      RadiusBottomRight: =8
                                                      RadiusTopLeft: =8
                                                      RadiusTopRight: =8
                                                      Size: =13
                                                      Text: ="Cancel"
                                                      Width: =96
                                                - btnGlGeoSave:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: ="Save geounit"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      BasePaletteColor: =RGBA(0, 18, 107, 1)
                                                      DisplayMode: =If(IsBlank(Trim(inpGlGeoShort.Text)) Or IsBlank(Trim(inpGlGeoLong.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =36
                                                      Icon: ="Save"
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =96
                                                      OnSelect: |-
                                                        =With(
                                                            {sn: Trim(inpGlGeoShort.Text), ln: Trim(inpGlGeoLong.Text)},
                                                            If(
                                                                !IsBlank(LookUp(dis_geounits, elv_name_short = sn And (locGeoMode = "Add" Or dis_geounit <> locGeoEdit.dis_geounit))),
                                                                Notify("Geounit " & sn & " already exists.", NotificationType.Warning),
                                                                With(
                                                                    {
                                                                        res: IfError(
                                                                            If(
                                                                                locGeoMode = "Add",
                                                                                Patch(dis_geounits, Defaults(dis_geounits), {elv_name_short: sn, elv_name_long: ln}),
                                                                                Patch(dis_geounits, locGeoEdit, {elv_name_short: sn, elv_name_long: ln})
                                                                            ),
                                                                            Blank()
                                                                        )
                                                                    },
                                                                    If(
                                                                        IsBlank(res),
                                                                        Notify("Failed to save geounit. " & First(Errors(dis_geounits)).Message, NotificationType.Error),
                                                                        Set(gblReceipt, {Screen: "GeoLoc", Action: If(locGeoMode = "Add", "Added", "Updated"), Title: "Geounit " & res.elv_name_short, Detail: "Long name " & res.elv_name_long});
                                                                        UpdateContext({locGeoMode: "", locGeoFocus: res});
                                                                        Notify("Geounit saved successfully!", NotificationType.Success)
                                                                    )
                                                                )
                                                            )
                                                        )
                                                      RadiusBottomLeft: =8
                                                      RadiusBottomRight: =8
                                                      RadiusTopLeft: =8
                                                      RadiusTopRight: =8
                                                      Size: =13
                                                      Text: ="Save"
                                                      Width: =96
                                    - conGlGeoHead:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(241, 244, 250, 1)
                                          FillPortions: =0
                                          Height: =36
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - txtGlGeoHShort:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="SHORT"
                                                Width: =80
                                                Wrap: =false
                                          - txtGlGeoHLong:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                FillPortions: =1
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="LONG NAME"
                                                Wrap: =false
                                          - txtGlGeoHAct:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="ACTIONS"
                                                Width: =112
                                                Wrap: =false
                                    - galGlGeo:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Geounit list"
                                          Default: =locGeoFocus
                                          Fill: =RGBA(226, 230, 239, 1)
                                          Items: =Sort(dis_geounits, elv_name_short)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =0
