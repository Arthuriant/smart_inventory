Screens:
  scr_consume:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conConsRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpConsSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
                  activemenu: ="Consume"
            - conConsMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpConsTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: ="Consume"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: ="Consume items from area stock"
                        Width: =912
                  - conConsBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        FillPortions: =1
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conConsCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 230, 239, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - conConsToolbar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conConsCatFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =140
                                        Children:
                                          - txtConsCatLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Category"
                                                Wrap: =false
                                          - ddConsCat:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Filter category"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.code
                                                Items: =dis_category_items
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conConsGeoFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =140
                                        Children:
                                          - txtConsGeoLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Geounit"
                                                Wrap: =false
                                          - ddConsGeo:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Filter geounit"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: =nfHomeLoc.dis_geounit
                                                DisplayMode: =If(!nfIsAdmin And CountRows(Distinct(nfMyGeoIds, Value)) <= 1, DisplayMode.Disabled, DisplayMode.Edit)
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.elv_name_long
                                                Items: =If(nfIsAdmin, dis_geounits, Filter(dis_geounits, dis_geounit in nfMyGeoIds))
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: |-
                                                  =Reset(ddConsLoc);
                                                  Reset(ddConsArea)
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conConsLocFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =140
                                        Children:
                                          - txtConsLocLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Location"
                                                Wrap: =false
                                          - ddConsLoc:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Filter location"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: |-
                                                  =If(
                                                      ddConsGeo.Selected.dis_geounit = nfHomeLoc.dis_geounit.dis_geounit,
                                                      nfHomeLoc
                                                  )
                                                DisplayMode: =If(IsBlank(ddConsGeo.Selected) Or (!nfIsAdmin And CountRows(Distinct(nfMyLocIds, Value)) <= 1), DisplayMode.Disabled, DisplayMode.Edit)
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Name
                                                Items: |-
                                                  =If(
                                                      nfIsAdmin,
                                                      Filter(dis_locations, dis_geounit.dis_geounit = ddConsGeo.Selected.dis_geounit),
                                                      Filter(dis_locations, dis_geounit.dis_geounit = ddConsGeo.Selected.dis_geounit, dis_location in nfMyLocIds)
                                                  )
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: =Reset(ddConsArea)
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conConsAreaFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =140
                                        Children:
                                          - txtConsAreaLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Area (From)"
                                                Wrap: =false
                                          - ddConsArea:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Source area"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Default: |-
                                                  =If(
                                                      ddConsLoc.Selected.dis_location = nfHomeLoc.dis_location,
                                                      nfHomeArea
                                                  )
                                                DisplayMode: =If(IsBlank(ddConsLoc.Selected), DisplayMode.Disabled, DisplayMode.Edit)
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Name
                                                Items: |-
                                                  =If(
                                                      nfIsAdmin,
                                                      Filter(dis_areas, (location.dis_location = ddConsLoc.Selected.dis_location Or (IsBlank(location) And 'elv_location (cr8a3_elv_location)'.dis_location = ddConsLoc.Selected.dis_location))),
                                                      Filter(dis_areas, (location.dis_location = ddConsLoc.Selected.dis_location Or (IsBlank(location) And 'elv_location (cr8a3_elv_location)'.dis_location = ddConsLoc.Selected.dis_location)), dis_area in nfMyAreaIds)
                                                  )
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conConsSearchFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtConsSearchLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Search item"
                                                Wrap: =false
                                          - inpConsSearch:
                                              Control: ModernTextInput
                                              Properties:
                                                AccessibleLabel: ="Search item"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Name or BPN"
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                TriggerOutput: =TriggerOutput.Delayed
                                                Type: =TextInputType.Search
                                    - icoConsReset:
                                        Control: ModernIcon
                                        Properties:
                                          AccessibleLabel: ="Reset filter"
                                          AlignInContainer: =AlignInContainer.End
                                          Height: =36
                                          Icon: ="ArrowReset"
                                          IconColor: =RGBA(100, 112, 130, 1)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Reset(ddConsCat);
                                            Reset(ddConsGeo);
                                            Reset(ddConsLoc);
                                            Reset(ddConsArea);
                                            Reset(inpConsSearch)
                                          PaddingBottom: =8
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Reset filter"
                                          Width: =36
                              - conConsTable:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - galCons:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Available stock"
                                          Fill: =RGBA(244, 246, 250, 1)
                                          FillPortions: =1
                                          Items: "=Filter(\n    dis_stocks,\n    \n    // 1. Filter Kategori (Langsung 1 level)\n    IsBlank(ddConsCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddConsCat.Selected.dis_category_item,\n    \n    // 2. Filter Area (Hanya filter berdasarkan Area yang dipilih, abaikan Geo/Loc karena sudah tersaring di dropdown)\n    IsBlank(ddConsArea.Selected) Or dis_area.dis_area = ddConsArea.Selected.dis_area,\n    \n    // 2b. RBAC: non-admin hanya melihat stok di area yang di-assign\n    nfIsAdmin Or dis_area.dis_area in nfMyAreaIds,\n    \n    // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)\n    IsBlank(inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.name, inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.part_number, inpConsSearch.Text)\n)"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =0
                                          TemplatePadding: =8
                                          TemplateSize: =346
                                          Visible: "=!IsEmpty(Filter(\n    dis_stocks,\n    \n    // 1. Filter Kategori (Langsung 1 level)\n    IsBlank(ddConsCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddConsCat.Selected.dis_category_item,\n    \n    // 2. Filter Area (Hanya filter berdasarkan Area yang dipilih, abaikan Geo/Loc karena sudah tersaring di dropdown)\n    IsBlank(ddConsArea.Selected) Or dis_area.dis_area = ddConsArea.Selected.dis_area,\n    \n    // 2b. RBAC: non-admin hanya melihat stok di area yang di-assign\n    nfIsAdmin Or dis_area.dis_area in nfMyAreaIds,\n    \n    // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)\n    IsBlank(inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.name, inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.part_number, inpConsSearch.Text)\n))"
                                          WrapCount: =4
                                        Children:
                                          - conConsRow:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =If(numConsQty.Value > 0, RGBA(15, 108, 189, 1), RGBA(226, 230, 239, 1))
                                                BorderThickness: =If(numConsQty.Value > 0, 2, 1)
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Height: =Parent.TemplateHeight
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =6
                                                PaddingBottom: =8
                                                PaddingLeft: =8
                                                PaddingRight: =8
                                                PaddingTop: =8
                                                RadiusBottomLeft: =12
                                                RadiusBottomRight: =12
                                                RadiusTopLeft: =12
                                                RadiusTopRight: =12
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - imgConsItem:
                                                    Control: Image
                                                    Properties:
                                                      AccessibleLabel: ="Photo " & ThisItem.dis_item_v2.name
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Fill: =RGBA(241, 244, 250, 1)
                                                      Height: =160
                                                      Image: =ThisItem.dis_item_v2.Image
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =4
                                                      PaddingLeft: =4
                                                      PaddingRight: =4
                                                      PaddingTop: =4
                                                      RadiusBottomLeft: =8
                                                      RadiusBottomRight: =8
                                                      RadiusTopLeft: =8
                                                      RadiusTopRight: =8
                                                      Tooltip: =ThisItem.dis_item_v2.name
                                                - txtConsName:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =36
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.dis_item_v2.name
                                                      VerticalAlign: =VerticalAlign.Top
                                                - bdgConsStock:
                                                    Control: Badge
                                                    Properties:
                                                      AccessibleLabel: ="Stock " & Text(ThisItem.qty)
                                                      AlignInContainer: =AlignInContainer.Start
                                                      Appearance: ='BadgeCanvas.Appearance'.Tint
                                                      Content: ="Stock " & Text(ThisItem.qty) & " " & Text(ThisItem.dis_item_v2.uom)
                                                      FontSize: =12
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =24
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Shape: ='BadgeCanvas.Shape'.Rounded
                                                      ThemeColor: =If(ThisItem.qty <= 0, 'BadgeCanvas.ThemeColor'.Danger, 'BadgeCanvas.ThemeColor'.Informative)
                                                      Width: =120
                                                - txtConsArea:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =RGBA(100, 112, 130, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =16
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =11
                                                      Text: ="BPN " & Coalesce(ThisItem.dis_item_v2.part_number, "-") & " · " & ThisItem.dis_area.Name
                                                      Wrap: =false
                                                - numConsQty:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AccessibleLabel: ="Consume qty " & ThisItem.dis_item_v2.name
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      Default: =0
                                                      DisplayMode: =If(ThisItem.qty <= 0, DisplayMode.Disabled, DisplayMode.Edit)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =48
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Min: =0
                                                      OnChange: =If(IsBlank(Self.Value), Reset(Self))
                                                      RadiusBottomLeft: =8
                                                      RadiusBottomRight: =8
                                                      RadiusTopLeft: =8
                                                      RadiusTopRight: =8
                                                      Size: =16
                                                      ValidationState: =If(Self.Value > ThisItem.qty || Self.Value < 0, ValidationState.Error, ValidationState.None)
                                                - txtConsWarn:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =RGBA(196, 43, 28, 1)
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =16
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =11
                                                      Text: ="Qty exceeds stock"
                                                      Visible: =numConsQty.Value > ThisItem.qty
                                                      Wrap: =false
                                    - txtConsEmpty:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 112, 130, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="No stock matches the filter."
                                          Visible: "=IsEmpty(Filter(\n    dis_stocks,\n    \n    // 1. Filter Kategori (Langsung 1 level)\n    IsBlank(ddConsCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddConsCat.Selected.dis_category_item,\n    \n    // 2. Filter Area (Hanya filter berdasarkan Area yang dipilih, abaikan Geo/Loc karena sudah tersaring di dropdown)\n    IsBlank(ddConsArea.Selected) Or dis_area.dis_area = ddConsArea.Selected.dis_area,\n    \n    // 2b. RBAC: non-admin hanya melihat stok di area yang di-assign\n    nfIsAdmin Or dis_area.dis_area in nfMyAreaIds,\n    \n    // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)\n    IsBlank(inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.name, inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.part_number, inpConsSearch.Text)\n))"
                                          Wrap: =false
                              - conConsActBar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - txtConsActSum:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(100, 112, 130, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =Text(CountRows(Filter(galCons.AllItems, numConsQty.Value > 0))) & " item(s) selected" & If(IsBlank(ddConsArea.Selected), " - select Area (From) first", "")
                                          Wrap: =false
                                    - btnConsActClear:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Clear all qty"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Secondary
                                          Color: =RGBA(31, 41, 55, 1)
                                          DisplayMode: =If(CountRows(Filter(galCons.AllItems, numConsQty.Value > 0)) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="ArrowReset"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =132
                                          OnSelect: =Reset(galCons)
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="Clear"
                                          Tooltip: ="Clear all qty"
                                          Width: =132
                                    - btnConsActSubmit:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Consume"
                                          AlignInContainer: =AlignInContainer.Center
                                          BasePaletteColor: =RGBA(0, 18, 107, 1)
                                          DisplayMode: |-
                                            =If(
                                                IsBlank(ddConsArea.Selected) ||
                                                CountRows(Filter(galCons.AllItems, numConsQty.Value > 0)) = 0 ||
                                                CountRows(Filter(galCons.AllItems, numConsQty.Value > qty || numConsQty.Value < 0)) > 0,
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="Cart"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =140
                                          OnSelect: |-
                                            =// 1. Validasi: Area dipilih, ada qty, dan tidak ada qty > stok
                                            If(
                                                IsBlank(ddConsArea.Selected),
                                                Notify("Please select Area (From) first!", NotificationType.Error),

                                                CountRows(Filter(galCons.AllItems, numConsQty.Value > 0)) = 0,
                                                Notify("Enter a quantity (Qty) for at least 1 item to consume!", NotificationType.Error),

                                                // FIX: qty melebihi stok diblokir
                                                CountRows(Filter(galCons.AllItems, numConsQty.Value > qty || numConsQty.Value < 0)) > 0,
                                                Notify("Qty exceeds available stock!", NotificationType.Error),

                                                // 2. Generate Nomor Transaksi (Autogenerate)
                                                With(
                                                    {
                                                        varLastTrx: First(Sort(dis_trx_headers, 'Created On', SortOrder.Descending)).transaction_number
                                                    },
                                                    With(
                                                        {
                                                            varNextIndex: If(IsBlank(varLastTrx), 1, Value(Right(varLastTrx, 4)) + 1)
                                                        },
                                                        With(
                                                            {
                                                                varTrxNumber: Text(Now(), "dd/mm/yy/") & Text(varNextIndex, "0000")
                                                            },
                                                            // 3. Simpan Header Transaksi (FIX: tipe Consume + area asal)
                                                            With(
                                                                {
                                                                    newHeader: Patch(
                                                                        dis_trx_headers,
                                                                        Defaults(dis_trx_headers),
                                                                        {
                                                                            transaction_number: varTrxNumber,
                                                                            type: 'type (dis_trx_headers)'.Consume,
                                                                            area_form: ddConsArea.Selected
                                                                        }
                                                                    )
                                                                },
                                                                // 4. Looping untuk setiap barang di galeri yang Qty-nya diisi
                                                                ForAll(
                                                                    Filter(galCons.AllItems, numConsQty.Value > 0) As ItemConsume,
                                                                    With(
                                                                        {
                                                                            // FIX: baca stok terbaru, bukan snapshot galeri
                                                                            oldQty: LookUp(dis_stocks, dis_stock = ItemConsume.dis_stock).qty,
                                                                            amt: ItemConsume.numConsQty.Value
                                                                        },
                                                                        // A. Simpan ke Detail Transaksi
                                                                        Patch(
                                                                            dis_trx_details,
                                                                            Defaults(dis_trx_details),
                                                                            {
                                                                                header_id: newHeader,
                                                                                PK: varTrxNumber & "-" & Text(RandBetween(1000, 9999)),
                                                                                item: ItemConsume.dis_item_v2,
                                                                                qty: amt
                                                                            }
                                                                        );
                                                                        // B. Kurangi stok
                                                                        Patch(
                                                                            dis_stocks,
                                                                            LookUp(dis_stocks, dis_stock = ItemConsume.dis_stock),
                                                                            {qty: oldQty - amt}
                                                                        )
                                                                    )
                                                                );
                                                                // 5. Bersihkan input, notifikasi
                                                                Reset(galCons);
                                                                Notify("Consume transaction saved and stock has been reduced!", NotificationType.Success)
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="Consume"
                                          Width: =140
