Screens:
  scr_consume:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conConsRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpConsSidebar:
                Control: CanvasComponent
                ComponentName: Sidebar
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =224
                  Width: =224
                  activemenu: ="Consume"
            - conConsMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpConsTopBar:
                      Control: CanvasComponent
                      ComponentName: TopBar
                      Properties:
                        ActiveMenu: ="Consume"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =64
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        Subtitle: ="Consume items from area stock"
                        Width: =912
                  - conConsBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 246, 250, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conConsCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 230, 239, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - conConsToolbar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.End
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conConsCatFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =200
                                        Children:
                                          - txtConsCatLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Category"
                                                Wrap: =false
                                          - ddConsCat:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Filter category"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.code
                                                Items: =dis_category_items
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conConsAreaFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =220
                                        Children:
                                          - txtConsAreaLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Area"
                                                Wrap: =false
                                          - ddConsArea:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Filter area"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Name
                                                Items: =Sort(nfMyAreas, Name)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: =Reset(ddConsRack)
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conConsRackFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =220
                                        Children:
                                          - txtConsRackLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Rack"
                                                Wrap: =false
                                          - ddConsRack:
                                              Control: ModernDropdown
                                              Properties:
                                                AccessibleLabel: ="Filter rack"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                ItemDisplayText: =ThisItem.Name & " (" & ThisItem.area.Name & ")"
                                                Items: |-
                                                  =Sort(
                                                      Filter(
                                                          dis_racks,
                                                          area.dis_area in nfMyAreaIds,
                                                          IsBlank(ddConsArea.Selected) Or area.dis_area = ddConsArea.Selected.dis_area
                                                      ),
                                                      Name
                                                  )
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                    - conConsSearchFld:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.End
                                          DropShadow: =DropShadow.None
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtConsSearchLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(100, 112, 130, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =16
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =11
                                                Text: ="Search item"
                                                Wrap: =false
                                          - inpConsSearch:
                                              Control: ModernTextInput
                                              Properties:
                                                AccessibleLabel: ="Search item"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =Appearance.Outline
                                                Font: =Font.'Segoe UI'
                                                Height: =36
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Name, BPN or SPN"
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =13
                                                TriggerOutput: =TriggerOutput.Delayed
                                                Type: =TextInputType.Search
                                    - icoConsReset:
                                        Control: ModernIcon
                                        Properties:
                                          AccessibleLabel: ="Reset filter"
                                          AlignInContainer: =AlignInContainer.End
                                          Height: =36
                                          Icon: ="ArrowReset"
                                          IconColor: =RGBA(100, 112, 130, 1)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Reset(ddConsCat);
                                            Reset(ddConsArea);
                                            Reset(ddConsRack);
                                            Reset(inpConsSearch)
                                          PaddingBottom: =8
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Reset filter"
                                          Width: =36
                              - conConsTable:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - galCons:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Available stock"
                                          Fill: =RGBA(244, 246, 250, 1)
                                          Items: "=Filter(\n    dis_stocks,\n    \n    // 1. Filter Kategori (Langsung 1 level)\n    IsBlank(ddConsCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddConsCat.Selected.dis_category_item,\n    \n    // 2. Filter Area (opsional, hanya filter tampilan)\n    IsBlank(ddConsArea.Selected) Or dis_area.dis_area = ddConsArea.Selected.dis_area,\n    \n    // 2a. Filter Rak (opsional)\n    IsBlank(ddConsRack.Selected) Or rack.dis_rack = ddConsRack.Selected.dis_rack,\n    \n    // 2b. RBAC: non-admin hanya melihat stok di area yang di-assign\n    dis_area.dis_area in nfMyAreaIds,\n    \n    // 2c. Barang Non-Active (tidak direstok lagi) disembunyikan\n    Not(dis_item_v2.status = 'status (dis_item_v2S)'.'Non-Active'),\n    \n    // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)\n    IsBlank(inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.name, inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.part_number, inpConsSearch.Text) Or StartsWith(dis_item_v2.client_number, inpConsSearch.Text)\n)"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TabIndex: =0
                                          TemplatePadding: =8
                                          TemplateSize: =376
                                          Visible: "=!IsEmpty(Filter(\n    dis_stocks,\n    \n    // 1. Filter Kategori (Langsung 1 level)\n    IsBlank(ddConsCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddConsCat.Selected.dis_category_item,\n    \n    // 2. Filter Area (opsional, hanya filter tampilan)\n    IsBlank(ddConsArea.Selected) Or dis_area.dis_area = ddConsArea.Selected.dis_area,\n    \n    // 2a. Filter Rak (opsional)\n    IsBlank(ddConsRack.Selected) Or rack.dis_rack = ddConsRack.Selected.dis_rack,\n    \n    // 2b. RBAC: non-admin hanya melihat stok di area yang di-assign\n    dis_area.dis_area in nfMyAreaIds,\n    \n    // 2c. Barang Non-Active (tidak direstok lagi) disembunyikan\n    Not(dis_item_v2.status = 'status (dis_item_v2S)'.'Non-Active'),\n    \n    // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)\n    IsBlank(inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.name, inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.part_number, inpConsSearch.Text) Or StartsWith(dis_item_v2.client_number, inpConsSearch.Text)\n))"
                                          WrapCount: =4
                                        Children:
                                          - conConsRow:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =If(Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0) > 0, RGBA(15, 108, 189, 1), RGBA(226, 230, 239, 1))
                                                BorderThickness: =If(Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0) > 0, 2, 1)
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Height: =Parent.TemplateHeight
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =6
                                                PaddingBottom: =8
                                                PaddingLeft: =8
                                                PaddingRight: =8
                                                PaddingTop: =8
                                                RadiusBottomLeft: =12
                                                RadiusBottomRight: =12
                                                RadiusTopLeft: =12
                                                RadiusTopRight: =12
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - imgConsItem:
                                                    Control: Image
                                                    Properties:
                                                      AccessibleLabel: ="Photo " & ThisItem.dis_item_v2.name
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Fill: =RGBA(241, 244, 250, 1)
                                                      Height: =160
                                                      Image: =ThisItem.dis_item_v2.Image
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =4
                                                      PaddingLeft: =4
                                                      PaddingRight: =4
                                                      PaddingTop: =4
                                                      RadiusBottomLeft: =8
                                                      RadiusBottomRight: =8
                                                      RadiusTopLeft: =8
                                                      RadiusTopRight: =8
                                                      Tooltip: =ThisItem.dis_item_v2.name
                                                - txtConsName:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =RGBA(31, 41, 55, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =36
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =ThisItem.dis_item_v2.name
                                                      VerticalAlign: =VerticalAlign.Top
                                                - bdgConsStock:
                                                    Control: Badge
                                                    Properties:
                                                      AccessibleLabel: ="Stock " & Text(ThisItem.qty)
                                                      AlignInContainer: =AlignInContainer.Start
                                                      Appearance: ='BadgeCanvas.Appearance'.Tint
                                                      Content: ="Stock " & Text(ThisItem.qty) & " " & Text(ThisItem.dis_item_v2.uom)
                                                      FontSize: =12
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =24
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Shape: ='BadgeCanvas.Shape'.Rounded
                                                      ThemeColor: =If(ThisItem.qty <= 0, 'BadgeCanvas.ThemeColor'.Danger, 'BadgeCanvas.ThemeColor'.Informative)
                                                      Width: =120
                                                - txtConsArea:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =RGBA(100, 112, 130, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =16
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =11
                                                      Text: ="BPN " & Coalesce(ThisItem.dis_item_v2.part_number, "-") & " · SPN " & Coalesce(ThisItem.dis_item_v2.client_number, "-") & " · Area " & ThisItem.dis_area.Name
                                                      Wrap: =false
                                                - bdgConsRack:
                                                    Control: Badge
                                                    Properties:
                                                      AccessibleLabel: =If(IsBlank(ThisItem.rack), "No rack assigned", "Stored in rack " & ThisItem.rack.Name)
                                                      AlignInContainer: =AlignInContainer.Start
                                                      Appearance: ='BadgeCanvas.Appearance'.Tint
                                                      Content: =If(IsBlank(ThisItem.rack), "No rack", "Rack " & ThisItem.rack.Name)
                                                      FontSize: =12
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =24
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Shape: ='BadgeCanvas.Shape'.Rounded
                                                      ThemeColor: =If(IsBlank(ThisItem.rack), 'BadgeCanvas.ThemeColor'.Subtle, 'BadgeCanvas.ThemeColor'.Brand)
                                                      Width: =180
                                                - txtConsQtySpace:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Height: =48
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Text: =""
                                                      Visible: =!(nfIsAdmin And ThisItem.qty <= 0)
                                                - btnConsNa:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: ="Set " & ThisItem.dis_item_v2.name & " to non-active"
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =ButtonAppearance.Secondary
                                                      Color: =RGBA(196, 43, 28, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =48
                                                      Icon: ="EyeOff"
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =UpdateContext({locConsNa: ThisItem.dis_item_v2})
                                                      RadiusBottomLeft: =8
                                                      RadiusBottomRight: =8
                                                      RadiusTopLeft: =8
                                                      RadiusTopRight: =8
                                                      Size: =13
                                                      Text: ="Non-active (not restocked)"
                                                      Visible: =nfIsAdmin And ThisItem.qty <= 0
                                                - txtConsWarn:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =RGBA(196, 43, 28, 1)
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =16
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =11
                                                      Text: ="Qty exceeds stock"
                                                      Visible: =Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0) > ThisItem.qty
                                                      Wrap: =false
                                          - btnConsMinus:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Decrease qty " & ThisItem.dis_item_v2.name
                                                BasePaletteColor: =RGBA(100, 112, 130, 1)
                                                DisplayMode: =If(Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0) <= 0, DisplayMode.Disabled, DisplayMode.Edit)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Bold
                                                Height: =48
                                                Layout: =ButtonLayout.TextOnly
                                                OnSelect: |-
                                                  =// Qty pilihan disimpan di colConsSel supaya tidak hilang saat search/filter
                                                  With(
                                                      {q: Max(0, Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0) - 1)},
                                                      RemoveIf(colConsSel, stockId = ThisItem.dis_stock);
                                                      If(q > 0, Collect(colConsSel, {stockId: ThisItem.dis_stock, itemRec: ThisItem.dis_item_v2, areaId: ThisItem.dis_area.dis_area, avail: ThisItem.qty, qty: q}))
                                                  )
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =24
                                                Text: ="−"
                                                Visible: =!(nfIsAdmin And ThisItem.qty <= 0)
                                                Width: =64
                                                X: =8
                                                Y: =298
                                          - numConsQtyVal:
                                              Control: ModernNumberInput
                                              Properties:
                                                AccessibleLabel: ="Consume qty " & ThisItem.dis_item_v2.name
                                                Align: =Align.Center
                                                Appearance: =Appearance.Outline
                                                Default: =Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0)
                                                DisplayMode: =If(ThisItem.qty <= 0, DisplayMode.Disabled, DisplayMode.Edit)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =48
                                                Min: =0
                                                OnChange: |-
                                                  =With(
                                                      {q: Max(0, Round(Coalesce(Self.Value, 0), 0))},
                                                      RemoveIf(colConsSel, stockId = ThisItem.dis_stock);
                                                      If(q > 0, Collect(colConsSel, {stockId: ThisItem.dis_stock, itemRec: ThisItem.dis_item_v2, areaId: ThisItem.dis_area.dis_area, avail: ThisItem.qty, qty: q}))
                                                  )
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =18
                                                ValidationState: =If(Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0) > ThisItem.qty, ValidationState.Error, ValidationState.None)
                                                Visible: =!(nfIsAdmin And ThisItem.qty <= 0)
                                                Width: =Parent.TemplateWidth - 160
                                                X: =80
                                                Y: =298
                                          - btnConsPlus:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Increase qty " & ThisItem.dis_item_v2.name
                                                BasePaletteColor: =RGBA(0, 18, 107, 1)
                                                DisplayMode: =If(ThisItem.qty <= 0 Or Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0) >= ThisItem.qty, DisplayMode.Disabled, DisplayMode.Edit)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Bold
                                                Height: =48
                                                Layout: =ButtonLayout.TextOnly
                                                OnSelect: |-
                                                  =With(
                                                      {q: Min(ThisItem.qty, Coalesce(LookUp(colConsSel, stockId = ThisItem.dis_stock).qty, 0) + 1)},
                                                      RemoveIf(colConsSel, stockId = ThisItem.dis_stock);
                                                      If(q > 0, Collect(colConsSel, {stockId: ThisItem.dis_stock, itemRec: ThisItem.dis_item_v2, areaId: ThisItem.dis_area.dis_area, avail: ThisItem.qty, qty: q}))
                                                  )
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =24
                                                Text: ="+"
                                                Visible: =!(nfIsAdmin And ThisItem.qty <= 0)
                                                Width: =64
                                                X: =Parent.TemplateWidth - 72
                                                Y: =298
                                    - txtConsEmpty:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 112, 130, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: ="No stock matches the filter."
                                          Visible: "=IsEmpty(Filter(\n    dis_stocks,\n    \n    // 1. Filter Kategori (Langsung 1 level)\n    IsBlank(ddConsCat.Selected) Or dis_item_v2.dis_category_item.dis_category_item = ddConsCat.Selected.dis_category_item,\n    \n    // 2. Filter Area (opsional, hanya filter tampilan)\n    IsBlank(ddConsArea.Selected) Or dis_area.dis_area = ddConsArea.Selected.dis_area,\n    \n    // 2a. Filter Rak (opsional)\n    IsBlank(ddConsRack.Selected) Or rack.dis_rack = ddConsRack.Selected.dis_rack,\n    \n    // 2b. RBAC: non-admin hanya melihat stok di area yang di-assign\n    dis_area.dis_area in nfMyAreaIds,\n    \n    // 2c. Barang Non-Active (tidak direstok lagi) disembunyikan\n    Not(dis_item_v2.status = 'status (dis_item_v2S)'.'Non-Active'),\n    \n    // 3. Pencarian Teks (Ganti 'in' dengan 'StartsWith' yang lebih ramah delegasi)\n    IsBlank(inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.name, inpConsSearch.Text) Or \n    StartsWith(dis_item_v2.part_number, inpConsSearch.Text) Or StartsWith(dis_item_v2.client_number, inpConsSearch.Text)\n))"
                                          Wrap: =false
                              - conConsNaBar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(240, 180, 176, 1)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(253, 237, 236, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Visible: =!IsBlank(locConsNa)
                                  Children:
                                    - txtConsNaMsg:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(31, 41, 55, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Set " & locConsNa.name & " to non-active? It is hidden from Consume, Receive and Transfer (History stays). Receiving or transferring it later makes it active again."
                                          Wrap: =true
                                    - btnConsNaYes:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Set non-active"
                                          AlignInContainer: =AlignInContainer.Center
                                          BasePaletteColor: =RGBA(196, 43, 28, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="EyeOff"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =120
                                          OnSelect: |-
                                            =With(
                                                {it: locConsNa},
                                                Patch(dis_item_v2S, LookUp(dis_item_v2S, dis_item_v2 = it.dis_item_v2), {status: 'status (dis_item_v2S)'.'Non-Active'});
                                                If(
                                                    IsEmpty(Errors(dis_item_v2S)),
                                                    UpdateContext({locConsNa: Blank()});
                                                    Notify(it.name & " is now non-active and hidden. Re-activate it in Item.", NotificationType.Success),
                                                    Notify("Failed to update item. " & First(Errors(dis_item_v2S)).Message, NotificationType.Error)
                                                )
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="Set non-active"
                                          Width: =150
                                    - btnConsNaNo:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Cancel"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Secondary
                                          Color: =RGBA(31, 41, 55, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =96
                                          OnSelect: |-
                                            =UpdateContext({locConsNa: Blank()})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="Cancel"
                                          Width: =96
                              - conConsActBar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - txtConsActSum:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =RGBA(100, 112, 130, 1)
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =Text(CountRows(colConsSel)) & " item(s) selected"
                                          Wrap: =false
                                    - btnConsActClear:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Clear all qty"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Secondary
                                          Color: =RGBA(31, 41, 55, 1)
                                          DisplayMode: =If(IsEmpty(colConsSel), DisplayMode.Disabled, DisplayMode.Edit)
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="ArrowReset"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =132
                                          OnSelect: |-
                                            =Clear(colConsSel);
                                            Reset(galCons)
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="Clear"
                                          Tooltip: ="Clear all qty"
                                          Width: =132
                                    - btnConsActSubmit:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Consume"
                                          AlignInContainer: =AlignInContainer.Center
                                          BasePaletteColor: =RGBA(0, 18, 107, 1)
                                          DisplayMode: |-
                                            =If(
                                                IsEmpty(colConsSel) ||
                                                CountRows(Filter(colConsSel, qty > avail)) > 0,
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          Font: =Font.'Segoe UI'
                                          Height: =36
                                          Icon: ="Cart"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =140
                                          OnSelect: |-
                                            =// 1. Validasi: ada qty, dan tidak ada qty > stok (area tidak wajib, diambil dari tiap baris stok)
                                            If(
                                                IsEmpty(colConsSel),
                                                Notify("Enter a quantity (Qty) for at least 1 item to consume!", NotificationType.Error),

                                                // Cek terhadap stok terbaru (pilihan bisa tersembunyi oleh filter)
                                                CountRows(Filter(colConsSel As c, c.qty > LookUp(dis_stocks, dis_stock = c.stockId).qty)) > 0,
                                                Notify("Qty exceeds available stock!", NotificationType.Error),

                                                With(
                                                    {
                                                        // Snapshot pilihan dari colConsSel (termasuk yang tersembunyi oleh filter)
                                                        selRows: ForAll(
                                                            colConsSel As c,
                                                            {stockId: c.stockId, itemRec: c.itemRec, areaId: c.areaId, amt: c.qty}
                                                        ),
                                                        varLastTrx: First(Sort(dis_trx_headers, 'Created On', SortOrder.Descending)).transaction_number
                                                    },
                                                    With(
                                                        {
                                                            areaIds: Distinct(selRows, areaId),
                                                            varNextIndex: If(IsBlank(varLastTrx), 1, Value(Right(varLastTrx, 4)) + 1)
                                                        },
                                                        // 2. Satu header transaksi per area asal stok
                                                        ForAll(
                                                            Sequence(CountRows(areaIds)) As s,
                                                            With(
                                                                {
                                                                    aId: Index(areaIds, s.Value).Value,
                                                                    trxNo: Text(Now(), "dd/mm/yy/") & Text(varNextIndex + s.Value - 1, "0000")
                                                                },
                                                                With(
                                                                    {
                                                                        newHeader: Patch(
                                                                            dis_trx_headers,
                                                                            Defaults(dis_trx_headers),
                                                                            {
                                                                                transaction_number: trxNo,
                                                                                type: 'type (dis_trx_headers)'.Consume,
                                                                                area_form: LookUp(dis_areas, dis_area = aId)
                                                                            }
                                                                        )
                                                                    },
                                                                    // 3. Detail transaksi + kurangi stok untuk item di area ini
                                                                    ForAll(
                                                                        Filter(selRows, areaId = aId) As r,
                                                                        Patch(
                                                                            dis_trx_details,
                                                                            Defaults(dis_trx_details),
                                                                            {
                                                                                header_id: newHeader,
                                                                                PK: trxNo & "-" & Text(RandBetween(1000, 9999)),
                                                                                item: r.itemRec,
                                                                                qty: r.amt
                                                                            }
                                                                        );
                                                                        // Baca stok terbaru, bukan snapshot galeri
                                                                        Patch(
                                                                            dis_stocks,
                                                                            LookUp(dis_stocks, dis_stock = r.stockId),
                                                                            {qty: LookUp(dis_stocks, dis_stock = r.stockId).qty - r.amt}
                                                                        )
                                                                    )
                                                                )
                                                            )
                                                        )
                                                    )
                                                );
                                                // 4. Bersihkan input, notifikasi
                                                Clear(colConsSel);
                                                Reset(galCons);
                                                Notify("Consume transaction saved and stock has been reduced!", NotificationType.Success)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =13
                                          Text: ="Consume"
                                          Width: =140
