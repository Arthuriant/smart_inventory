                                            =Sort(
                                                Search(
                                                    Filter(
                                                        dis_trx_headers,
                                                        IsBlank(locHistType) || type = locHistType,
                                                        (IsBlank(datHistDate.SelectedDate) Or
                                                            ('Created On' >= datHistDate.SelectedDate And 'Created On' < DateAdd(datHistDate.SelectedDate, 1, TimeUnit.Days))
