                        - btnRcvFCEmptyAll:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Empty cart"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =RGBA(31, 41, 55, 1)
                              DisplayMode: =If(IsEmpty(colRcvCart), DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Segoe UI'
                              Height: =36
                              Icon: ="Delete"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =96
                              OnSelect: =Clear(colRcvCart)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="Empty cart"
                              Width: =128
                        - btnRcvFCSubmit:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Receive the cart into the area"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =RGBA(0, 18, 107, 1)
                              DisplayMode: =If(IsEmpty(colRcvCart) Or IsBlank(ddRcvFArea.Selected), DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Segoe UI'
                              Height: =36
                              Icon: ="ArrowDownload"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =120
                              OnSelect: |-
                                =If(
                                    IsBlank(ddRcvFArea.Selected),
                                    Notify("Pick the area that receives the goods.", NotificationType.Error),
                                    IsEmpty(colRcvCart),
                                    Notify("The cart is empty.", NotificationType.Error),
                                    !IsEmpty(Filter(colRcvCart, Qty < 1)),
                                    Notify("Every item needs a qty of at least 1.", NotificationType.Error),
                                    With(
                                        {
                                            ar: ddRcvFArea.Selected,
                                            aid: ddRcvFArea.Selected.dis_area,
                                            varLastTrx: First(Sort(dis_trx_headers, 'Created On', SortOrder.Descending)).transaction_number
                                        },
                                        With(
                                            {trxNo: Text(Now(), "dd/mm/yy/") & Text(If(IsBlank(varLastTrx), 1, Value(Right(varLastTrx, 4)) + 1), "0000")},
                                            With(
                                                {
                                                    hdr: Patch(
                                                        dis_trx_headers,
                                                        Defaults(dis_trx_headers),
                                                        {
                                                            transaction_number: trxNo,
                                                            type: 'type (dis_trx_headers)'.Receive,
                                                            area_to: ar
                                                        }
                                                    )
                                                },
                                                // 1 detail per cart line; stock goes up in the area and the chosen rack is stored on the stock row
                                                ForAll(
                                                    colRcvCart As c,
                                                    Patch(
                                                        dis_trx_details,
                                                        Defaults(dis_trx_details),
                                                        {header_id: hdr, PK: trxNo & "-" & Text(RandBetween(1000, 9999)), item: c.Item, qty: c.Qty}
                                                    );
                                                    With(
                                                        {st: With({iid: c.Item.dis_item_v2}, LookUp(dis_stocks, dis_item_v2.dis_item_v2 = iid And dis_area.dis_area = aid))},
                                                        If(
                                                            IsBlank(st),
                                                            Patch(
                                                                dis_stocks,
                                                                Defaults(dis_stocks),
                                                                {
                                                                    PK: "STK-" & Text(Now(), "yyMMddHHmmss") & "-" & Text(RandBetween(10, 99)),
                                                                    dis_item_v2: c.Item,
                                                                    dis_area: ar,
                                                                    qty: c.Qty,
                                                                    rack: c.Rack,
                                                                    min_qty: c.Min
                                                                }
                                                            ),
                                                            Patch(dis_stocks, st, {qty: st.qty + c.Qty, rack: If(IsBlank(c.Rack), st.rack, c.Rack), inactive: false, min_qty: If(IsBlank(c.Min), st.min_qty, c.Min)})
                                                        )
                                                    )
                                                );
                                                Set(
                                                    gblReceipt,
                                                    {
                                                        Screen: "Transaction",
                                                        Action: "Received",
                                                        Title: trxNo,
                                                        Detail: "Type Receive | To " & ar.Name & " | " & Text(CountRows(colRcvCart)) & " item(s), qty " & Text(Sum(colRcvCart, Qty))
                                                    }
                                                );
                                                Clear(colRcvCart);
                                                UpdateContext({locRcvCartOpen: false});
                                                Notify("Receive " & trxNo & " saved & stock updated!", NotificationType.Success);
                                                Navigate(scr_receive, ScreenTransition.None)
                                            )
                                        )
                                    )
                                )
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="Receive"
                              Width: =140
