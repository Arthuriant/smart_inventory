                                    Wrap: =false
                              - numRcvFCQty:
                                  Control: ModernNumberInput
                                  Properties:
                                    AccessibleLabel: ="Qty " & ThisItem.Item.name
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =Appearance.Outline
                                    Default: =ThisItem.Qty
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
