                                    OnChange: |-
                                      =If(Self.Value >= 1, Patch(colRcvCart, ThisItem, {Qty: Self.Value}))
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =13
                                    ValidationState: =If(Self.Value < 1, ValidationState.Error, ValidationState.None)
                                    Width: =96
                              - inpRcvFCMin:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Minimum stock in this area for " & ThisItem.Item.name
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =Appearance.Outline
                                    Default: =If(IsBlank(ThisItem.Min), "", Text(ThisItem.Min))
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =// blank = keep the area's current min (new stock: item default applies)
                                      Patch(colRcvCart, ThisItem, {Min: If(IsBlank(Self.Text) Or IsError(Value(Self.Text)), Blank(), Max(0, Round(Value(Self.Text), 0)))})
                                    Placeholder: |-
                                      =With(
                                          {iid: ThisItem.Item.dis_item_v2, aid: ddRcvFArea.Selected.dis_area},
                                          Coalesce(Text(Coalesce(LookUp(dis_stocks, dis_item_v2.dis_item_v2 = iid And dis_area.dis_area = aid).min_qty, ThisItem.Item.min_qty)), "-")
