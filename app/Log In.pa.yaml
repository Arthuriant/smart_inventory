Screens:
  Log In:
    Properties:
      Fill: =clrBg
      LoadingSpinnerColor: =clrAccent
    Children:
      - conLoginRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conLoginBrand:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =clrNavy
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =48
                  PaddingLeft: =48
                  PaddingRight: =48
                  PaddingTop: =48
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - imgLoginLogo:
                      Control: Image
                      Properties:
                        AccessibleLabel: ="SLB logo"
                        AlignInContainer: =AlignInContainer.Start
                        FillPortions: =0
                        Height: =56
                        Image: ='slb logo white'
                        ImagePosition: =ImagePosition.Fit
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =140
                  - txtLoginTitle:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =92
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =30
                        Text: ="DIGITAL INVENTORY SYSTEM"
                        Wrap: =true
                  - txtLoginTag:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 0.8)
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =42
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Well Construction Equipment & Fluid - ING - TLM"
                        Wrap: =true
            - conLoginRight:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =clrBg
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =48
                  PaddingLeft: =48
                  PaddingRight: =48
                  PaddingTop: =48
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conLoginCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =clrBorder
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =clrSurface
                        FillPortions: =0
                        Height: =290
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =32
                        PaddingLeft: =32
                        PaddingRight: =32
                        PaddingTop: =32
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =420
                      Children:
                        - txtLoginHello:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =clrTextMuted
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="Selamat datang,"
                              Wrap: =false
                        - txtLoginName:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =clrText
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =24
                              Text: =Coalesce(nfMe.Name, User().FullName)
                              Wrap: =false
                        - bdgLoginRole:
                            Control: Badge
                            Properties:
                              AccessibleLabel: ="Peran pengguna"
                              AlignInContainer: =AlignInContainer.Start
                              Appearance: ='BadgeCanvas.Appearance'.Tint
                              Content: =If(IsBlank(nfMe.role), "Belum terdaftar", Proper(Text(nfMe.role)))
                              FillPortions: =0
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Shape: ='BadgeCanvas.Shape'.Rounded
                              ThemeColor: ='BadgeCanvas.ThemeColor'.Brand
                              Width: =160
                        - txtLoginDesc:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =clrTextMuted
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: ="Kelola stok, transaksi, dan pemakaian peralatan dalam satu aplikasi."
                              Wrap: =true
                        - btnLoginEnter:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Masuk ke Dashboard"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =clrNavy
                              DisplayMode: =If(IsBlank(nfMe.Name), DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =0
                              Font: =Font.'Segoe UI'
                              Height: =44
                              Icon: ="ArrowRight"
                              Layout: =ButtonLayout.IconAfter
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scr_dashboard, ScreenTransition.Fade)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =14
                              Text: ="Masuk ke Dashboard"
