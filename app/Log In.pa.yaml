Screens:
  Log In:
    Properties:
      Fill: =RGBA(0, 18, 107, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =Set(
            imyrole,
            LookUp(
                dis_users,
                email = User().Email
            ).role
        );
        Set(
            imyemail,
            LookUp(
                dis_users,
                email = User().Email
            ).email
        );
    Children:
      - Rectangle1:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            BorderStyle: =BorderStyle.Dotted
            BorderThickness: =3
            Fill: =RGBA(102, 113, 166, 1)
            Height: =323
            Width: =825
            X: =158
            Y: =174
      - Label1_2:
          Control: Label
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =67
            Size: =40
            Text: ="DIGITAL INVENTORY SYSTEM"
            Width: =1012
            X: =65
            Y: =81
      - Label3_1:
          Control: Label
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =81
            Size: =20
            Text: |-
              ="Lets Get Started to
              "
            Width: =315
            X: =414
      - Button1:
          Control: Classic/Button
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(0, 0, 0, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: '=If(imyrole = dis_role.administrator,DisplayMode.Edit,DisplayMode.Disabled) '
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =121
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(HomeAdmin)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =20
            Text: ="HOME"
            Visible: |-
              =If(imyrole = dis_role.administrator,
              true,
              false)
            Width: =310
            X: =422
            Y: =280
      - Label3:
          Control: Label
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =73
            Size: =20
            Text: ="Your role is administrator"
            Visible: |-
              =If(
                  imyrole = dis_role.administrator,
                  true,
                  false
              )
            Width: =376
            X: =389
            Y: =179
      - Image3:
          Control: Image
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =64
            Image: ='slb logo white'
            Width: =154
            X: =494
            Y: =534
      - LabelLogInforUser:
          Control: Label
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =20
            Text: ="You are in User Mode"
            Visible: |-
              =If(imyrole = dis_role.user,
              true,
              false)
            Width: =321
            X: =408
            Y: =181
      - Label3_2:
          Control: Label
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Lighter
            Height: =44
            Size: =16
            Text: ="WELL CONSTRUCTION EQUIPMENT & FLUID - ING - TLM"
            Visible: |-
              =If(
                  imyrole = dis_role.administrator,
                  true,
                  false
              )
            Width: =825
            X: =158
            Y: =452
      - ButtonUser:
          Control: Classic/Button
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(0, 0, 0, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =121
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(HomeUser)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =20
            Text: ="HOME"
            Visible: |-
              =If(imyrole = dis_role.administrator,
              false,
              true)
            Width: =310
            X: =422
            Y: =280
